*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);color:var(--text-1);background:var(--bg-base);-webkit-font-smoothing:antialiased;overflow:hidden;font-size:14px;line-height:1.6}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;color:inherit;font-size:14px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
.pb-glass{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-lg);backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--shadow-md),var(--shadow-glow)}
.pb-glass--strong{background:var(--glass-bg-strong);border:1px solid var(--glass-border-strong)}
.pb-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 20px;border-radius:var(--radius-md);font-size:14px;font-weight:600;transition:all var(--dur) var(--ease);white-space:nowrap;border:1px solid transparent}
.pb-btn:disabled{opacity:.5;cursor:not-allowed}
.pb-btn--primary{background:var(--accent-grad);color:#fff;box-shadow:0 4px 18px rgba(56,189,248,.28)}
.pb-btn--primary:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06)}
.pb-btn--ghost{background:var(--glass-bg);border-color:var(--glass-border);color:var(--text-1)}
.pb-btn--ghost:hover{background:var(--hover);border-color:var(--glass-border-strong)}
.pb-btn--danger{background:var(--danger-soft);border-color:rgba(248,113,113,.35);color:var(--danger)}
.pb-btn--danger:hover{background:rgba(248,113,113,.22)}
.pb-btn--sm{height:32px;padding:0 14px;font-size:13px;border-radius:var(--radius-sm)}
.pb-btn--block{width:100%}
.pb-iconbtn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);color:var(--text-2);transition:all var(--dur) var(--ease);font-size:15px}
.pb-iconbtn:hover{background:var(--hover);color:var(--text-1)}
.pb-field{display:flex;flex-direction:column;gap:6px}
.pb-label{font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:.02em}
.pb-input{width:100%;height:40px;padding:0 14px;border-radius:var(--radius-md);background:var(--input-bg);border:1px solid var(--glass-border);color:var(--text-1);font-size:14px;transition:all var(--dur) var(--ease)}
.pb-input::placeholder{color:var(--text-3)}
.pb-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pb-input:disabled{opacity:.55;cursor:not-allowed}
.pb-input--mono{font-family:var(--font-mono);font-size:13px}
.pb-textarea{width:100%;min-height:72px;padding:10px 14px;border-radius:var(--radius-md);background:var(--input-bg);border:1px solid var(--glass-border);color:var(--text-1);font-size:12.5px;resize:vertical;line-height:1.6}
.pb-textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pb-badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pb-badge--success{background:var(--success-soft);color:var(--success)}
.pb-badge--warning{background:var(--warning-soft);color:var(--warning)}
.pb-badge--danger{background:var(--danger-soft);color:var(--danger)}
.pb-badge--neutral{background:var(--glass-bg-strong);color:var(--text-2);border:1px solid var(--glass-border)}
.pb-badge--accent{background:var(--accent-soft);color:var(--accent)}
.pb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.pb-dot--ok{background:var(--success);box-shadow:0 0 8px var(--success)}
.pb-dot--err{background:var(--danger);box-shadow:0 0 8px var(--danger)}
.pb-dot--idle{background:var(--text-3)}
.pb-mono{font-family:var(--font-mono)}
.pb-muted{color:var(--text-3)}
.pb-subtle{color:var(--text-2)}
.pb-sm{font-size:12.5px}
.pb-xs{font-size:11.5px}
.pb-bold{font-weight:700}
.pb-truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-fill{flex:1;min-width:0}
.pb-break-all{word-break:break-all}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pb-modal-mask{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(4,8,16,.55);backdrop-filter:blur(6px);animation:fade var(--dur) var(--ease)}
.pb-modal{width:min(440px,92vw);max-height:80vh;overflow-y:auto;padding:20px;border-radius:12px;display:flex;flex-direction:column;gap:12px;white-space:pre-line;animation:pop .28s var(--ease)}

.admin{flex:1;min-height:0;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}

function toast(text,type='success'){
  const t=document.createElement('div');
  t.className='pb-toast pb-toast--'+type;
  t.innerHTML='<span>'+(type==='success'?'✓':type==='error'?'✕':'!')+'</span><span>'+text+'</span>';
  toasts.appendChild(t);
  setTimeout(()=>t.remove(),3200);
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pubFingerprint(pub){
  const s=String(pub||'');let h=0;
  for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}
  const hex=h.toString(16).toUpperCase().padStart(8,'0');
  return hex.slice(0,4)+':'+hex.slice(4)+'·16B';
}
function copyText(text,label){
  navigator.clipboard?.writeText(text);

let showDevices=false;
let currentTab='overview';

function visibleUsers(){return showAdmins?users:users.filter(u=>u.role!=='admin');}

/* ============ 渲染 ============ */
function render(){
  const views={overview:renderOverview,groups:renderGroups,open:renderOpen,review:renderReview,invite:renderInvite,devices:renderDevices};
  (views[currentTab]||renderOverview)();
  renderNav();
}
function renderNav(){
  const nav=document.getElementById('adminNav');
  const items=[
    ['overview','📊 概览',null],
    ['groups','👥 组管理',groups.filter(g=>!g.archived).length],
    ['open','🧑‍💼 成员',null],
    ['review','✅ 注册审核',regRequests.length],
    ['invite','🎟 邀请码',invites.filter(i=>i.status==='active').length],
    ['devices','🖥 设备',devices.filter(d=>d.online).length],
  ];
  nav.innerHTML=items.map(([v,label,count])=>`<button class="admin-nav__item ${currentTab===v?'on':''}" onclick="gotoTab('${v}')">${label}${count!=null?` <span class="pb-badge ${v==='review'&&count>0?'pb-badge--warning':'pb-badge--neutral'}">${count}</span>`:''}</button>`).join('');
}
function gotoTab(t){currentTab=t;render();}

function renderHead(subtitle){
  return `<div class="admin__head">
    <div><h2>管理面板</h2><span class="pb-xs pb-muted">${subtitle}</span></div>
    <div class="admin__head-actions">
      <button class="pb-btn pb-btn--ghost pb-btn--sm" onclick="gotoTab('devices')">🖥 设备（${devices.length}）</button>
      <button class="pb-btn pb-btn--ghost pb-btn--sm" onclick="toast('数据已刷新','info')">⟳ 刷新</button>
      <button class="pb-btn pb-btn--ghost pb-btn--sm" onclick="toast('已锁定','info')">⏻ 锁定</button>
      <button class="pb-btn pb-btn--ghost pb-btn--sm" onclick="toast('返回密码本列表（客户端原型）','info')">← 返回</button>
    </div>
  </div>`;
}

/* ---- 概览 ---- */
function renderOverview(){
  const online=users.filter(u=>u.role!=='admin').length;
  const activeGroups=groups.filter(g=>!g.archived).length;
  const regCount=regRequests.length;
  stage.innerHTML=`
  ${renderHead('团队与密钥 · 全貌')}
  <div class="admin__grid">
    <div class="pb-glass admin__panel">
      <div class="admin__panel-title">快速入口</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <button class="pb-btn pb-btn--ghost" onclick="gotoTab('review')">✅ 注册申请审核（<b>${regCount}</b> 待审）</button>
        <button class="pb-btn pb-btn--ghost" onclick="gotoTab('invite')">🎟 生成邀请码</button>
        <button class="pb-btn pb-btn--ghost" onclick="gotoTab('groups')">👥 组管理</button>
        <button class="pb-btn pb-btn--ghost" onclick="gotoTab('open')">🧑‍💼 成员开户</button>
      </div>
    </div>
    <div class="pb-glass admin__panel">
      <div class="admin__panel-title">统计</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
        <div class="admin__item" style="flex-direction:column;align-items:flex-start"><span class="pb-bold" style="font-size:22px;font-family:var(--font-mono)">${visibleUsers().length}</span><span class="pb-xs pb-muted">成员数</span></div>
        <div class="admin__item" style="flex-direction:column;align-items:flex-start"><span class="pb-bold" style="font-size:22px;font-family:var(--font-mono)">${activeGroups}</span><span class="pb-xs pb-muted">活跃组</span></div>
        <div class="admin__item" style="flex-direction:column;align-items:flex-start"><span class="pb-bold" style="font-size:22px;font-family:var(--font-mono)">${regCount}</span><span class="pb-xs pb-muted">待审申请</span></div>
        <div class="admin__item" style="flex-direction:column;align-items:flex-start"><span class="pb-bold" style="font-size:22px;font-family:var(--font-mono)">${devices.filter(d=>d.online).length}<span class="pb-xs pb-muted" style="font-weight:400;font-size:12px"> / ${devices.length}</span></span><span class="pb-xs pb-muted">设备在线</span></div>
      </div>
      <p class="pb-xs pb-muted" style="margin-top:6px">管理功能集成桌面端：成员开户 / 组管理 / 注册审核 / 邀请码 / 设备监控，均在本面板完成。</p>
    </div>
  </div>`;
}

/* ---- 组管理 ---- */
function renderGroups(){
  function memberHtml(g){
    const ms=members[g.id]||[];
    const inGroup=new Set(ms.map(m=>m.user_id));
    const candidates=users.filter(u=>u.role!=='admin'&&!inGroup.has(u.user_id));
    return `<div class="admin__members">
      <div class="admin__panel-title">组「${esc(g.name)}」成员（${ms.length}）</div>
      ${ms.map(m=>{
        const devs=(m.devices||[]).map(d=>`${esc(d.hostname)}（${d.ip}）`).join(' / ');
        return `<div class="admin__item">
          <div class="admin__item-main">
            <span class="admin__item-title"><span class="pb-dot ${m.online?'pb-dot--ok':'pb-dot--idle'}"></span>${esc(m.name)}</span>
            <span class="pb-xs pb-muted">设备 ${m.devices.length} 台${devs?' · '+esc(devs):''}</span>
          </div>
          <div class="admin__item-actions">
            <span class="pb-badge ${m.online?'pb-badge--success':'pb-badge--neutral'}">${m.online?'在线':'离线'}</span>
            ${m.role!=='admin'?`<button class="pb-btn pb-btn--ghost pb-btn--sm" onclick="removeMember('${g.id}','${m.user_id}','${esc(m.name)}')">移除</button>
            <button class="pb-btn pb-btn--danger pb-btn--sm" onclick="revokeMember('${g.id}','${m.user_id}','${esc(m.name)}')">吊销</button>`:''}
          </div>
        </div>`;
      }).join('')||'<p class="pb-xs pb-muted">该组暂无成员</p>'}
      <div class="admin__input-row" style="margin-top:4px">
        <select class="pb-input" id="addSel_${g.id}" ${candidates.length?'':'disabled'} style="appearance:auto;cursor:pointer">
          ${candidates.length?candidates.map(u=>`<option value="${u.user_id}">${esc(u.name)}（${esc(u.username)}）</option>`).join(''):'<option value="">无可用成员（均已加入或不存在）</option>'}
        </select>
        <button class="pb-btn pb-btn--primary pb-btn--sm" ${candidates.length?'':'disabled'} onclick="addMemberInline('${g.id}',document.getElementById('addSel_${g.id}'))">＋ 加入本组</button>
      </div>
    </div>`;
  }
  stage.innerHTML=`
  ${renderHead('组与成员 · 在线状态')}
  <div class="pb-glass admin__panel">
    <div class="admin__panel-title">组</div>
    <div class="admin__input-row">
      <input class="pb-input" placeholder="新组名" id="newGroupName"/>
      <button class="pb-btn pb-btn--primary pb-btn--sm" onclick="createGroup()">建组</button>
    </div>
    <div class="admin__list">
      ${groups.map(g=>`
        <div class="admin__item">
          <div class="admin__item-main">
            <span class="admin__item-title">${esc(g.name)} ${g.archived?'<span class="pb-badge pb-badge--neutral">已归档</span>':''}</span>
            <span class="pb-xs pb-muted">${esc(g.id)}</span>
          </div>
          <div class="admin__item-actions">
            ${!g.archived?`
            <button class="pb-btn pb-btn--ghost pb-btn--sm" onclick="toggleGroup('${g.id}')">${selectedGroup===g.id?'收起成员':'成员'}</button>
            <button class="pb-btn pb-btn--ghost pb-btn--sm pb-btn--danger" onclick="archiveGroup('${g.id}')">删除</button>`:
            `<button class="pb-btn pb-btn--ghost pb-btn--sm" onclick="unarchiveGroup('${g.id}')">恢复</button>`}
          </div>
        </div>
        ${selectedGroup===g.id?memberHtml(g):''}
      `).join('')||'<p class="pb-xs pb-muted">暂无组</p>'}
    </div>
  </div>`;
}
function toggleGroup(id){selectedGroup=selectedGroup===id?null:id;render();}
function createGroup(){const v=document.getElementById('newGroupName').value.trim();if(!v){toast('请输入组名','error');return;}const gid='grp_'+Date.now();groups.push({id:gid,name:v,archived:false});members[gid]=[];toast(`组已创建`);render();}
function addMemberInline(gid,selectEl){
  const uid=selectEl.value;
  if(!uid){toast('请选择成员','error');return;}
  const u=users.find(x=>x.user_id===uid);
  if(!u)return;
  if((members[gid]||[]).some(m=>m.user_id===uid)){toast(`「${u.name}」已在该组中`,'error');return;}
  members[gid]=members[gid]||[];
  members[gid].push({user_id:u.user_id,name:u.name,online:false,role:u.role,devices:[]});
  toast(`成员「${u.name}」已加入组`);render();
}
function archiveGroup(id){const g=groups.find(x=>x.id===id);confirmModal('删除组',`确认删除组「${g.name}」？该操作将归档组，服务端要求组名二次确认。`,()=>{g.archived=true;toast(`组「${g.name}」已删除`);render();});}
function unarchiveGroup(id){const g=groups.find(x=>x.id===id);g.archived=false;toast(`组「${g.name}」已恢复`);render();}
function removeMember(gid,uid,name){confirmModal('移除成员',`确认将「${name}」移出该组？`,()=>{members[gid]=members[gid].filter(m=>m.user_id!==uid);toast(`成员「${name}」已移出`);render();});}
function revokeMember(gid,uid,name){confirmModal('吊销成员',`确认吊销「${name}」？吊销后其私钥立即失效，组内成员将自动重加密。`,()=>{members[gid]=members[gid].filter(m=>m.user_id!==uid);users=users.filter(u=>u.user_id!==uid);toast(`成员「${name}」已吊销，组内成员将自动重加密`);render();});}

/* ---- 成员开户 ---- */
function renderOpen(){
  stage.innerHTML=`
  ${renderHead('开户 · 绑定工号与公钥')}
  <div class="pb-glass admin__panel">
    <div class="admin__panel-title">成员开户</div>
    <div class="admin__form">
      <div class="admin__form-row">
        <input class="pb-input pb-input--mono" placeholder="工号（唯一、不可改）" id="nuUser"/>
        <input class="pb-input" placeholder="显示名" id="nuName"/>
      </div>
      <textarea class="pb-textarea pb-mono" placeholder="公钥（base64，成员客户端生成后复制给你）" id="nuKey"></textarea>
      <div class="admin__form-row">
        <button class="pb-btn pb-btn--ghost pb-btn--sm" onclick="pasteRegInfo()">📋 从注册信息导入</button>
        <button class="pb-btn pb-btn--primary pb-btn--block" style="flex:1" onclick="createUser()">开户</button>
      </div>
    </div>
    <div class="admin__panel-title" style="margin-top:8px"><span>成员列表</span>
      <label class="admin__switch"><input type="checkbox" ${showAdmins?'checked':''} onchange="showAdmins=this.checked;render()"/><span>显示管理员</span></label>
    </div>
    <div class="admin__list">
      ${visibleUsers().map(u=>`
        <div class="admin__item">
          <div class="admin__item-main">
            <span class="admin__item-title">${esc(u.name)} ${u.role==='admin'?'<span class="pb-badge pb-badge--accent">管理员</span>':''}</span>
            <span class="pb-xs pb-muted">工号 ${esc(u.username)}</span>
          </div>
          <div class="admin__item-actions">
            ${u.role!=='admin'?`<button class="pb-btn pb-btn--ghost pb-btn--sm pb-btn--danger" onclick="revokeUser('${u.user_id}','${esc(u.name)}')">吊销</button>`:''}
          </div>
        </div>`).join('')||'<p class="pb-xs pb-muted">暂无成员</p>'}
    </div>
  </div>`;
}
function createUser(){
  const u=document.getElementById('nuUser').value.trim();
  const n=document.getElementById('nuName').value.trim();
  const k=document.getElementById('nuKey').value.trim();
  if(!u||!n||!k){toast('请填写工号、显示名、公钥','error');return;}
  users.push({user_id:'u'+Date.now(),username:u,name:n,role:'member'});
  toast(`用户已开户（工号 ${u}）`);render();
}
function pickUser(uid){toast('请在「组管理」页展开组后直接下拉选人加入','info');}
function revokeUser(uid,name){confirmModal('吊销成员',`确认吊销「${name}」？吊销后其私钥立即失效，组内成员将自动重加密。`,()=>{users=users.filter(u=>u.user_id!==uid);toast(`成员「${name}」已吊销`);render();});}
function pasteRegInfo(){
  promptModal('从注册信息导入','粘贴成员发来的「注册信息」（成员端「复制注册信息」按钮的内容）：','工号：zhangsan\n公钥：MFkwEwYHKoZIzj0CAQYI…',(raw)=>{
    const uname=raw.match(/工号[:：]\s*(\S+)/);
    const pub=raw.match(/公钥[:：]\s*(\S+)/);
    if(!uname||!pub){toast('解析失败：未找到「工号」或「公钥」','error');return;}
    document.getElementById('nuUser').value=uname[1].trim();
    document.getElementById('nuKey').value=pub[1].trim();
    toast(`已从注册信息导入工号「${uname[1].trim()}」，核对后开户`,'info');
  });
}

/* ---- 注册申请审核 ---- */
function renderReview(){
  stage.innerHTML=`
  ${renderHead(`注册申请 · ${regRequests.length} 待审`)}
  <div class="pb-glass admin__panel">
    <div class="admin__panel-title">注册申请审核（<span class="pb-badge pb-badge--warning">${regRequests.length} 待审</span>）</div>
    ${regRequests.length?`<div class="admin__list">
      ${regRequests.map(rq=>`
        <div class="admin__item" style="flex-direction:column;align-items:stretch">
          <div class="admin__item-main">
            <span class="admin__item-title">工号 ${esc(rq.username)}</span>
            <span class="pb-xs pb-muted">设备：${esc(rq.device_name||'—')} · IP：${esc(rq.ip||'—')} · 申请时间 ${fmtTime(rq.created_at)}</span>
            <div class="admin__pubrow">
              <span class="pb-xs pb-muted">公钥指纹：</span>
              <span class="pb-mono pb-xs" style="color:var(--accent)">SM2 ${pubFingerprint(rq.sm2_public_key)}</span>
              <button class="pb-btn pb-btn--ghost pb-btn--sm" style="height:22px;padding:0 8px;font-size:11px" onclick="copyText('${esc(rq.sm2_public_key)}','公钥已复制')">⧉ 复制公钥</button>
              <span class="pb-xs pb-muted pb-truncate" title="${esc(rq.sm2_public_key)}">${esc(rq.sm2_public_key.slice(0,28))}…</span>
            </div>
          </div>
          <div class="admin__form-row" style="margin-top:4px">
            <input class="pb-input pb-input--mono" style="flex:1" placeholder="显示名（默认=工号）" value="${esc(rq.username)}"/>
            <button class="pb-btn pb-btn--primary pb-btn--sm" onclick="approveRequest('${rq.id}','${esc(rq.username)}')">✓ 通过并开户</button>
            <button class="pb-btn pb-btn--ghost pb-btn--sm pb-btn--danger" onclick="rejectRequest('${rq.id}','${esc(rq.username)}')">✕ 拒绝</button>
          </div>
        </div>`).join('')}
    </div>`:`<p class="pb-xs pb-muted">暂无待审核的注册申请</p>`}
  </div>
  <p class="pb-xs pb-muted">· 通过后自动开户并关联公钥，成员端注册申请将自动完成设备注册。每 5 秒自动刷新。</p>`;
}
function approveRequest(id,uname){confirmModal('通过注册申请并开户',`确认通过「${uname}」的申请并开户？\n显示名：${uname}\n公钥/设备名/IP 已核对`,()=>{regRequests=regRequests.filter(r=>r.id!==id);users.push({user_id:'u'+Date.now(),username:uname,name:uname,role:'member'});toast(`已开户「${uname}」`);render();});}
function rejectRequest(id,uname){confirmModal('拒绝注册申请',`确认拒绝「${uname}」的注册申请？`,()=>{regRequests=regRequests.filter(r=>r.id!==id);toast(`已拒绝「${uname}」`);render();});}

/* ---- 邀请码 ---- */
function renderInvite(){
  stage.innerHTML=`
  ${renderHead('邀请码 · 注册码（绑定工号）')}
  <div class="pb-glass admin__panel">
    <div class="admin__panel-title">生成邀请码</div>
    <div class="admin__form-row">
      <input class="pb-input pb-input--mono" style="flex:1" placeholder="工号（该工号注册用）" id="invUser"/>
      <input class="pb-input pb-input--mono" style="width:70px" type="number" min="1" value="3" title="有效期天数（默认3天）"/>
      <label class="admin__switch" title="免审核：提交申请即自动开户"><input type="checkbox"/><span>免审核</span></label>
      <button class="pb-btn pb-btn--ghost pb-btn--sm" onclick="createInvite()">生成</button>
    </div>
  </div>
  <div class="pb-glass admin__panel">
    <div class="admin__panel-title">邀请码列表</div>
    <div class="admin__list">
      ${invites.map(inv=>{
        const statusBadge=inv.status==='active'
          ?`<span class="pb-badge pb-badge--success">有效</span>`
          :inv.status==='used'?`<span class="pb-badge pb-badge--neutral">已使用</span>`
          :`<span class="pb-badge pb-badge--danger">已过期</span>`;
        const statusText=inv.status==='active'
          ?`有效至 ${new Date(inv.expires_at*1000).toLocaleDateString()}`
          :inv.status==='used'?'已使用':'过期于 '+new Date(inv.expires_at*1000).toLocaleDateString();
        return `
        <div class="admin__item" style="${inv.status!=='active'?'opacity:.62':''}">
          <div class="admin__item-main">
            <span class="admin__item-title pb-mono">${esc(inv.code)} ${statusBadge}</span>
            <span class="pb-xs pb-muted">工号 ${esc(inv.username)} · ${inv.auto_approve?'<span style="color:var(--accent)">免审核</span>':'需审核'} · ${statusText}</span>
          </div>
          ${inv.status==='active'?`<button class="pb-btn pb-btn--ghost pb-btn--sm" onclick="copyInvite('${esc(inv.code)}')">复制</button>`:''}
        </div>`;}).join('')||'<p class="pb-xs pb-muted">暂无邀请码</p>'}
    </div>
  </div>`;
}
function createInvite(){
  const v=document.getElementById('invUser').value.trim();
  if(!v){toast('请输入工号','error');return;}
  const code='PB-'+Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
  invites.unshift({code,username:v,auto_approve:false,status:'active',expires_at:Date.now()/1000+3*86400});
  toast(`已生成邀请码 ${code}，有效期至 ${new Date(Date.now()+3*86400000).toLocaleDateString()}`);render();
}
function copyInvite(code){copyText(code,'邀请码已复制');}

/* ---- 设备 ---- */
function renderDevices(){
  stage.innerHTML=`
  ${renderHead('设备 / 主机信息')}
  <div class="pb-glass admin__panel">
    <div class="admin__panel-title">设备 / 主机信息（${devices.length}）</div>
    <div class="admin__device-list">
      ${devices.map(d=>`
        <div class="admin__device">
          <div class="admin__item-main">
            <span class="admin__item-title"><span class="pb-dot ${d.online?'pb-dot--ok':'pb-dot--idle'}"></span>${esc(d.name||'未命名设备')}</span>
            <span class="pb-xs pb-muted">用户：${esc(d.user_name||'—')} · 主机名：${esc(d.hostname||'—')}</span>
            <span class="pb-xs pb-muted">IP：${esc(d.ip||'—')} · 最后在线：${fmtTime(d.last_seen)}</span>
          </div>
          <span class="pb-badge ${d.online?'pb-badge--success':'pb-badge--neutral'}">${d.online?'在线':'离线'}</span>
        </div>`).join('')||'<p class="pb-xs pb-muted">暂无设备</p>'}
    </div>
  </div>`;
}

/* ============ 通用弹窗 ============ */
function confirmModal(title,msg,onOk){
  const mask=document.createElement('div');mask.className='pb-modal-mask';
  mask.innerHTML=`<div class="pb-glass pb-glass--strong pb-modal">
    <div class="pb-modal__title">${esc(title)}</div>
    <div class="pb-modal__msg">${esc(msg)}</div>
    <div class="pb-modal__actions">
      <button class="pb-btn pb-btn--ghost" data-act="no">取消</button>
      <button class="pb-btn pb-btn--primary" data-act="yes">确定</button>
    </div>
  </div>`;
  mask.addEventListener('click',e=>{
    const act=e.target.closest('button[data-act]')?.getAttribute('data-act');
    if(!act)return;
    mask.remove();
    if(act==='yes')onOk();
  });
  document.body.appendChild(mask);
}
function promptModal(title,msg,placeholder,cb){
  const mask=document.createElement('div');mask.className='pb-modal-mask';
  mask.innerHTML=`<div class="pb-glass pb-glass--strong pb-modal">
    <div class="pb-modal__title">${esc(title)}</div>
    <div class="pb-modal__msg">${esc(msg)}</div>
    <textarea class="pb-input pb-mono pb-modal__textarea" placeholder="${esc(placeholder)}"></textarea>
    <div class="pb-modal__actions">
      <button class="pb-btn pb-btn--ghost" data-act="no">取消</button>
      <button class="pb-btn pb-btn--primary" data-act="yes">导入</button>
    </div>
  </div>`;
  mask.addEventListener('click',e=>{
    const act=e.target.closest('button[data-act]')?.getAttribute('data-act');
    if(!act)return;
    const val=mask.querySelector('textarea').value.trim();
    mask.remove();
    if(act==='yes')cb(val);
  });
  document.body.appendChild(mask);
  mask.querySelector('textarea').focus();
}

/* ============ 初始化 ============ */
render();
</script>
</body>
</html>
