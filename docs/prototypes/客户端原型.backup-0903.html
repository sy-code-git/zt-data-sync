<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线密码本 · 客户端原型</title>
<style>
:root{
  --font-sans:"HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","PingFang SC","Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","Cascadia Code",Consolas,monospace;
  --radius-sm:8px;--radius-md:12px;--radius-lg:18px;
  --dur:.24s;--ease:cubic-bezier(.22,1,.36,1);
}
:root[data-theme="dark"]{
  --bg-base:#070b14;--bg-grad-a:#0b1226;--bg-grad-b:#070b14;--bg-grad-c:#0a1a33;
  --glass-bg:rgba(255,255,255,.055);--glass-bg-strong:rgba(255,255,255,.09);
  --glass-border:rgba(255,255,255,.1);--glass-border-strong:rgba(255,255,255,.18);
  --text-1:#eef3fb;--text-2:rgba(238,243,251,.72);--text-3:rgba(238,243,251,.45);
  --accent:#38bdf8;--accent-2:#22d3ee;--accent-grad:linear-gradient(135deg,#38bdf8 0%,#22d3ee 100%);--accent-soft:rgba(56,189,248,.14);
  --success:#34d399;--warning:#fbbf24;--danger:#f87171;--info:#60a5fa;
  --success-soft:rgba(52,211,153,.14);--warning-soft:rgba(251,191,36,.14);--danger-soft:rgba(248,113,113,.14);
  --shadow-md:0 8px 32px rgba(0,0,0,.45);--shadow-glow:0 0 40px rgba(56,189,248,.12);
  --input-bg:rgba(255,255,255,.06);--hover:rgba(255,255,255,.09);--active:rgba(255,255,255,.13);
  --scroll-thumb:rgba(255,255,255,.16);--scroll-thumb-hover:rgba(255,255,255,.28);
}
:root[data-theme="light"]{
  --bg-base:#f2f5fb;--bg-grad-a:#fff;--bg-grad-b:#eef2f9;--bg-grad-c:#e6f0fb;
  --glass-bg:rgba(255,255,255,.62);--glass-bg-strong:rgba(255,255,255,.82);
  --glass-border:rgba(15,23,42,.09);--glass-border-strong:rgba(15,23,42,.16);
  --text-1:#0f1c2e;--text-2:rgba(15,28,46,.66);--text-3:rgba(15,28,46,.4);
  --accent:#0284c7;--accent-2:#0ea5e9;--accent-grad:linear-gradient(135deg,#0284c7 0%,#0ea5e9 100%);--accent-soft:rgba(2,132,199,.1);
  --success:#059669;--warning:#d97706;--danger:#dc2626;--info:#2563eb;
  --success-soft:rgba(5,150,105,.1);--warning-soft:rgba(217,119,6,.1);--danger-soft:rgba(220,38,38,.1);
  --shadow-md:0 8px 28px rgba(15,23,42,.1);--shadow-glow:0 0 36px rgba(14,165,233,.14);
  --input-bg:rgba(255,255,255,.75);--hover:rgba(15,23,42,.055);--active:rgba(15,23,42,.09);
  --scroll-thumb:rgba(15,23,42,.2);--scroll-thumb-hover:rgba(15,23,42,.32);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);color:var(--text-1);background:var(--bg-base);-webkit-font-smoothing:antialiased;overflow:hidden;font-size:14px;line-height:1.6}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;color:inherit;font-size:14px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* 通用组件 */
.pb-glass{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-lg);backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--shadow-md),var(--shadow-glow)}
.pb-glass--strong{background:var(--glass-bg-strong);border:1px solid var(--glass-border-strong)}
.pb-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 20px;border-radius:var(--radius-md);font-size:14px;font-weight:600;transition:all var(--dur) var(--ease);white-space:nowrap;border:1px solid transparent}
.pb-btn:disabled{opacity:.5;cursor:not-allowed}
.pb-btn--primary{background:var(--accent-grad);color:#fff;box-shadow:0 4px 18px rgba(56,189,248,.28)}
.pb-btn--primary:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06)}
.pb-btn--ghost{background:var(--glass-bg);border-color:var(--glass-border);color:var(--text-1)}
.pb-btn--ghost:hover{background:var(--hover);border-color:var(--glass-border-strong)}
.pb-btn--danger{background:var(--danger-soft);border-color:rgba(248,113,113,.35);color:var(--danger)}
.pb-btn--sm{height:32px;padding:0 14px;font-size:13px;border-radius:var(--radius-sm)}
.pb-btn--lg{height:46px;padding:0 28px;font-size:15px}
.pb-btn--block{width:100%}
.pb-iconbtn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);color:var(--text-2);transition:all var(--dur) var(--ease);font-size:15px}
.pb-iconbtn:hover{background:var(--hover);color:var(--text-1)}
.pb-field{display:flex;flex-direction:column;gap:6px}
.pb-label{font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:.02em}
.pb-input{width:100%;height:40px;padding:0 14px;border-radius:var(--radius-md);background:var(--input-bg);border:1px solid var(--glass-border);color:var(--text-1);font-size:14px;transition:all var(--dur) var(--ease)}
.pb-input::placeholder{color:var(--text-3)}
.pb-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pb-input:disabled{opacity:.55;cursor:not-allowed}
.pb-input--mono{font-family:var(--font-mono);font-size:13px}
.pb-input--lg{height:46px;font-size:15px}
.pb-input-group{position:relative;display:flex;align-items:center}
.pb-input-group .pb-input{padding-right:44px}
.pb-input-group__action{position:absolute;right:6px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);color:var(--text-3);transition:all var(--dur) var(--ease)}
.pb-input-group__action:hover{color:var(--text-1);background:var(--hover)}
.pb-badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pb-badge--success{background:var(--success-soft);color:var(--success)}
.pb-badge--warning{background:var(--warning-soft);color:var(--warning)}
.pb-badge--danger{background:var(--danger-soft);color:var(--danger)}
.pb-badge--neutral{background:var(--glass-bg-strong);color:var(--text-2);border:1px solid var(--glass-border)}
.pb-badge--accent{background:var(--accent-soft);color:var(--accent)}
.pb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.pb-dot--ok{background:var(--success);box-shadow:0 0 8px var(--success)}
.pb-dot--warn{background:var(--warning);box-shadow:0 0 8px var(--warning)}
.pb-dot--err{background:var(--danger);box-shadow:0 0 8px var(--danger)}
.pb-dot--idle{background:var(--text-3)}
.pb-divider{height:1px;background:var(--glass-border);border:none;margin:0}
.pb-mono{font-family:var(--font-mono)}
.pb-muted{color:var(--text-3)}
.pb-subtle{color:var(--text-2)}
.pb-sm{font-size:12.5px}
.pb-xs{font-size:11.5px}
.pb-bold{font-weight:700}
.pb-truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-fill{flex:1;min-width:0}
.pb-center{display:flex;align-items:center;justify-content:center}
.pb-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:56px 24px;color:var(--text-3);text-align:center}
.pb-empty__icon{font-size:42px;opacity:.7}
.pb-empty__title{font-size:15px;font-weight:600;color:var(--text-2)}
.pb-empty__desc{font-size:13px;max-width:320px;line-height:1.7}
.pb-spinner{width:18px;height:18px;border:2px solid var(--glass-border-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pb-modal-mask{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(4,8,16,.55);backdrop-filter:blur(6px);animation:fade var(--dur) var(--ease)}
.pb-modal{width:min(520px,calc(100vw-64px));max-height:calc(100vh-96px);display:flex;flex-direction:column;animation:pop .28s var(--ease)}
.pb-modal__head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 0}
.pb-modal__title{font-size:16px;font-weight:700}
.pb-modal__body{padding:20px 24px;overflow-y:auto;color:var(--text-2);display:flex;flex-direction:column;gap:16px}
.pb-modal__foot{display:flex;justify-content:flex-end;gap:10px;padding:0 24px 20px}
.pb-toast-wrap{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.pb-toast{display:flex;align-items:center;gap:10px;padding:11px 18px;border-radius:var(--radius-md);background:var(--glass-bg-strong);border:1px solid var(--glass-border-strong);box-shadow:var(--shadow-md);font-size:13.5px;font-weight:500;color:var(--text-1);animation:pop .3s var(--ease);pointer-events:auto}
.pb-toast--success{border-color:rgba(52,211,153,.45)}
.pb-toast--error{border-color:rgba(248,113,113,.45)}
.pb-toast--warn{border-color:rgba(251,191,36,.45)}

/* 外壳 / 标题栏 */
.shell{position:relative;height:100vh;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--bg-grad-a) 0%,var(--bg-grad-b) 48%,var(--bg-grad-c) 100%)}
.bg-glow{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.bg-glow--a{width:520px;height:520px;top:-180px;right:-120px;background:radial-gradient(circle,var(--accent) 0%,transparent 68%);opacity:.16}
.bg-glow--b{width:460px;height:460px;bottom:-160px;left:-120px;background:radial-gradient(circle,var(--accent-2) 0%,transparent 66%);opacity:.13}
.bg-grid{position:absolute;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--glass-border) 1px,transparent 1px),linear-gradient(90deg,var(--glass-border) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,rgba(0,0,0,.5),transparent 70%);mask-image:radial-gradient(ellipse at 50% 30%,rgba(0,0,0,.5),transparent 70%)}
.titlebar{position:relative;z-index:10;height:44px;display:flex;align-items:center;padding-left:16px;border-bottom:1px solid var(--glass-border);background:var(--glass-bg);backdrop-filter:blur(18px) saturate(140%);user-select:none;flex-shrink:0}
.titlebar__brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:.02em}
.titlebar__logo{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;background:var(--accent-grad);color:#fff;font-size:12px;box-shadow:0 2px 10px rgba(56,189,248,.4)}
.titlebar__tag{font-size:11px;font-weight:500;color:var(--text-3);letter-spacing:.06em;margin-left:4px}
.titlebar__drag{flex:1;height:100%}
.titlebar__controls{display:flex;align-items:center;gap:2px;padding-right:8px}
.titlebar__btn{width:40px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;color:var(--text-2);transition:all var(--dur) var(--ease)}
.titlebar__btn:hover{background:var(--hover);color:var(--text-1)}
.titlebar__btn--close:hover{background:#e11d48;color:#fff}
.autolock-bar{position:relative;z-index:10;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 12px;font-size:12.5px;color:var(--warning);background:var(--glass-bg);border-bottom:1px solid var(--glass-border)}
.stage{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column}
.stage-boot{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text-3);font-size:13.5px}

/* ============ 解锁页 ============ */
.unlock{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:1.1fr 1fr}
.unlock__left{overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:48px}
.unlock__hero{max-width:400px;display:flex;flex-direction:column;gap:8px;animation:pop .4s var(--ease)}
.unlock__logo{width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:26px;border-radius:16px;background:var(--accent-grad);box-shadow:0 8px 30px rgba(56,189,248,.35);margin-bottom:12px}
.unlock__title{font-size:32px;font-weight:800;letter-spacing:.01em}
.unlock__subtitle{font-size:15px;color:var(--text-2);margin-bottom:20px}
.unlock__feats{list-style:none;display:flex;flex-direction:column;gap:10px;font-size:13.5px;color:var(--text-2)}
.unlock__feats li{display:flex;align-items:center;gap:10px}
.feat-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);flex-shrink:0}
.unlock__right{overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:32px}
.unlock__card{margin:auto;width:100%;max-width:440px;padding:32px;display:flex;flex-direction:column;gap:16px;animation:pop .34s var(--ease)}
.unlock__card-head{display:flex;align-items:center;justify-content:space-between}
.unlock__card-head h2{font-size:19px;font-weight:700}
.unlock__section{display:flex;flex-direction:column;gap:10px}
.unlock__section-title{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--text-2)}
.unlock__saved-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-md);background:var(--glass-bg);border:1px solid var(--glass-border);font-size:13px}
.unlock__input-row{display:flex;gap:8px}
.unlock__input-row .pb-input{flex:1}
.unlock__hint{font-size:12px;color:var(--text-3);line-height:1.6}
.unlock__tip{display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:10px 12px;border-radius:var(--radius-md);line-height:1.6;word-break:break-all}
.unlock__tip--info{background:var(--accent-soft);color:var(--accent)}
.unlock__tip--ok{background:var(--success-soft);color:var(--success)}
.unlock__tip--err{background:var(--danger-soft);color:var(--danger)}
.unlock__skip{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:2px 0}
.unlock__import{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:var(--radius-md);border:1px dashed var(--glass-border-strong)}
.unlock__foot{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--text-3)}
.unlock__pub{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:var(--radius-md);background:var(--glass-bg);border:1px solid var(--glass-border)}
.unlock__readonly{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:var(--radius-md);background:var(--glass-bg);border:1px solid var(--glass-border);min-width:0}
.unlock__pub-row{display:flex;align-items:center;gap:8px;font-size:12px}
.unlock__autounlock{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border-radius:var(--radius-md);border:1px dashed var(--glass-border-strong)}
.unlock__seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:var(--radius-md);background:var(--input-bg);border:1px solid var(--glass-border)}
.unlock__seg button{height:34px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:var(--text-2);transition:all var(--dur) var(--ease)}
.unlock__seg button.on{background:var(--accent-soft);color:var(--accent)}
.unlock__seg button:not(.on):hover{background:var(--hover);color:var(--text-1)}
.unlock__regtabs{display:flex;gap:6px;margin-top:2px}
.unlock__regtabs button{height:28px;padding:0 12px;border-radius:99px;font-size:12.5px;color:var(--text-2);border:1px solid var(--glass-border);background:var(--glass-bg);transition:all var(--dur) var(--ease)}
.unlock__regtabs button.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.unlock__regresult{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--radius-md);border:1px solid var(--glass-border);background:var(--glass-bg)}
.unlock__regresult--ok{border-color:rgba(52,211,153,.4);background:var(--success-soft)}
.unlock__regresult--wait{border-color:rgba(251,191,36,.4);background:var(--warning-soft)}
.unlock__pubkey-box{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--radius-md);background:var(--input-bg);border:1px dashed var(--glass-border-strong)}
.unlock__pubkey-text{font-family:var(--font-mono);font-size:11.5px;word-break:break-all;color:var(--text-2);line-height:1.5}
.unlock__skip-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.unlock__modal-mask{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.unlock__modal{width:min(560px,92vw);max-height:86vh;overflow-y:auto;padding:20px;border-radius:12px;display:flex;flex-direction:column;gap:14px;animation:pop .3s var(--ease)}
.unlock__modal-title{margin:0 0 6px;font-size:16px;font-weight:700}
.unlock__modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

/* ============ 列表页 ============ */
.list-view{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px;gap:14px}
.list-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.list-toolbar__left{display:flex;flex:1}
.list-toolbar__right{display:flex;align-items:center;gap:8px}
.list-search{position:relative;width:min(420px,100%)}
.list-search__icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:15px;pointer-events:none}
.list-search__input{width:100%;height:38px;padding:0 14px 0 36px;border-radius:var(--radius-md);background:var(--input-bg);border:1px solid var(--glass-border);color:var(--text-1);font-size:13.5px;transition:all var(--dur) var(--ease)}
.list-search__input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.list-search__clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;display:none;align-items:center;justify-content:center;border-radius:50%;color:var(--text-3);font-size:12px}
.list-search__clear:hover{background:var(--active);color:var(--text-1)}
.list-search--filled .list-search__clear{display:inline-flex}
.list-body{flex:1;min-height:0;display:grid;grid-template-columns:320px 1fr;gap:14px}
.list-tree{display:flex;flex-direction:column;min-height:0}
.pb-glass--flat{box-shadow:none;backdrop-filter:blur(10px)}
.list-pane-title{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;font-size:13px;font-weight:700;letter-spacing:.03em;flex-shrink:0}
.list-tree__scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 8px 12px}
.pb-tree-node{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:var(--radius-sm);cursor:pointer;transition:all var(--dur) var(--ease);color:var(--text-2);font-size:13.5px;white-space:nowrap;position:relative}
.pb-tree-node:hover{background:var(--hover);color:var(--text-1)}
.pb-tree-node--active{background:var(--accent-soft);color:var(--text-1)}
.pb-tree-node--active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--accent)}
.pb-tree-node__quick{display:none;width:22px;height:22px;align-items:center;justify-content:center;border-radius:6px;font-size:12px;color:var(--text-3);flex-shrink:0}
.pb-tree-node:hover .pb-tree-node__quick{display:inline-flex}
.pb-tree-node__quick:hover{background:var(--active);color:var(--accent)}
.pb-tree-node__arrow{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;transition:transform var(--dur) var(--ease);color:var(--text-3);font-size:11px;flex-shrink:0}
.pb-tree-node__arrow--open{transform:rotate(90deg)}
.pb-tree-node__icon{font-size:15px;flex-shrink:0}
.list-detail{min-height:0;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.detail-head__title{display:flex;align-items:center;gap:12px}
.detail-head__icon{font-size:22px}
.detail-head__title h2{font-size:20px;font-weight:700}
.detail-head__badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.detail-meta{letter-spacing:.02em}
.detail-field{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--radius-md);background:var(--glass-bg);border:1px solid var(--glass-border)}
.detail-field__label{font-size:12.5px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}

input[type=range]{accent-color:var(--accent)}

.demo-bar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;background:rgba(4,8,16,.6);backdrop-filter:blur(14px);border-top:1px solid var(--glass-border);font-size:12px;flex-wrap:wrap}

.stage{padding-bottom:0}

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtTime(ts){if(!ts)return '—';const d=new Date(ts*1000);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function maskVal(key,val){return /pass|secret|token|pwd|密码/i.test(key)?'••••••••':val;}
function buildTree(parentId){return entries.filter(e=>e.parent_id===parentId).map(e=>({entry:e,children:buildTree(e.id)}));}

function renderList(){

  function treeHtml(nodes){
    return nodes.map(n=>{
      const e=n.entry;const isOpen=expanded.includes(e.id);const hasCh=n.children.length>0;
      const row=`
        <div class="pb-tree-node ${e.id===selectedId?'pb-tree-node--active':''}" data-node-id="${e.id}" style="padding-left:${12+depthOf(e.id)*12}px" onclick="selectNode('${e.id}')">
          <span class="pb-tree-node__arrow ${isOpen?'pb-tree-node__arrow--open':''}" onclick="event.stopPropagation();toggleNode('${e.id}')">▶</span>
          <span class="pb-tree-node__icon">${typeMeta[e.type]?.icon||'📄'}</span>

          ${e.conflict_of?'<span class="pb-badge pb-badge--danger" style="height:18px;padding:0 8px;font-size:11px">冲突</span>':''}
        </div>`;

    }).join('');

          <span class="pb-tree-node__icon">${typeMeta[c.entry.type]?.icon||'📄'}</span>
          <span class="pb-fill pb-truncate">${esc(c.entry.title)}</span>
          ${c.children.length?`<span class="pb-xs pb-muted">${c.children.length} 子项</span>`:''}
        </div>`).join(''):`
        <div class="pb-empty" style="padding:32px 16px"><span class="pb-empty__icon">📂</span><span class="pb-empty__title">暂无子条目</span></div>`)+`</div>`;
    }
    return `
      <div class="detail-head">
        <div class="detail-head__title">

          <h2>${esc(e.title)}</h2>
        </div>
        <div class="detail-head__badges">
          ${e.dirty?'<span class="pb-badge pb-badge--warning">未推送</span>':''}

      </div>
    </div>
    <div class="list-body">
      <div class="list-tree pb-glass pb-glass--flat">
        <div class="list-pane-title"><span>条目树</span><span class="pb-xs pb-muted">${entries.filter(e=>!e.deleted).length} 项</span></div>
        <div class="list-tree__scroll">${treeHtml(roots)}</div>
      </div>
      <div class="list-detail pb-glass pb-glass--flat">
        ${sel?detailHtml(sel):`<div class="pb-empty"><span class="pb-empty__icon">🔐</span><span class="pb-empty__title">从左侧选择一条条目</span><span class="pb-empty__desc">树形浏览项目 → 环境 → IP 类型 → 账号类型 → 账号 五层骨架</span></div>`}

}

const revealed=new Set();
function toggleReveal(key,realVal){
  const el=document.getElementById('val_'+key);
  if(!el)return;
  if(revealed.has(key)){revealed.delete(key);el.textContent=maskVal(key,realVal);}
  else{revealed.add(key);el.textContent=realVal;}
}
function newChild(pid){
  const p=entries.find(x=>x.id===pid);
  if(!p)return;
  const childType={project:'env',env:'ip_type',ip_type:'acc_type',acc_type:'account'}[p.type]||'account';
  window._newChildParent=pid;
  window._newChildType=childType;
  selectedId=null;goto('edit');
  showModal('新建子项',`将在 <b class="pb-mono">${esc(p.title)}</b> 下新建${typeMeta[childType]?.label||'条目'}（原型：演示流程）`,[
    {label:'取消',cls:'pb-btn--ghost',fn:closeModal},

  ]);
}
function toggleNode(id){const i=expanded.indexOf(id);if(i>=0)expanded.splice(i,1);else expanded.push(id);render();}
function demoSearch(kw){
  kw=kw.trim().toLowerCase();
  document.querySelectorAll('.pb-tree-node').forEach(r=>r.style.display='');
  const applyFilled=()=>{const w=document.getElementById('listSearch');if(w)w.classList.toggle('list-search--filled',kw!=='');const i=document.getElementById('searchInput');if(i&&document.activeElement!==i)i.value=kw;};
  applyFilled();
  if(!kw){render();return;}
  // 计算匹配节点（标题 + 字段值），匹配节点的祖先链一并保留并自动展开
  const match=new Set();
  for(const e of entries){
    const hay=[e.title,...Object.keys(e.fields||{}),...Object.values(e.fields||{}),...Object.keys(e.custom_fields||{}),...Object.values(e.custom_fields||{})].join('\n').toLowerCase();
    if(hay.includes(kw))match.add(e.id);
  }
  // 祖先链纳入匹配集
  for(const e of entries){
    if(match.has(e.id)){
      let p=e.parent_id;
      while(p){match.add(p);p=entries.find(x=>x.id===p)?.parent_id;}
    }
  }
  // 祖先链上的节点自动展开，保证匹配节点可见
  for(const id of match){const i=expanded.indexOf(id);if(i<0)expanded.push(id);}
  render();
  applyFilled();
  document.querySelectorAll('.pb-tree-node').forEach(r=>{
    const id=r.getAttribute('data-node-id');
    if(id&&!match.has(id))r.style.display='none';
  });
}

            ${c&&c.startsWith('manual:')?`
            <input class="pb-input pb-input--mono conflict-resolve__input" id="manual_${k}" value="${esc(manualVal)}" placeholder="输入自定义值"/>
            <button class="pb-btn pb-btn--primary pb-btn--sm" onclick="confirmManual('${k}')">确定</button>
            <button class="pb-btn pb-btn--ghost pb-btn--sm" onclick="pickSide('${k}','')">取消</button>`:
            `<button class="pb-btn pb-btn--ghost pb-btn--sm ${c&&c.startsWith('manual:')?'conflict-resolve__active':''}" onclick="pickSide('${k}','manual')">手动</button>`}
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="conflict-actions">
      <span class="pb-fill"></span>
      <button class="pb-btn pb-btn--danger" onclick="resolveConflict()">确认解决并同步</button>
    </div>
    <p class="conflict-hint">未列出的字段已按「仅一方修改则采用修改方」自动合并。</p>
  </div>`;
}
function resolveConflict(){toast('冲突已解决，变更将同步到服务端');goto('list');}
function pickSide(key,side){
  const c=window._conflictChoices||{};
  if(side==='manual'){c[key]='manual:';render();}
  else{c[key]=side;render();}
}
function confirmManual(key){
  const c=window._conflictChoices||{};
  const inp=document.getElementById('manual_'+key);
  const v=inp?inp.value.trim():'';
  if(!v){toast('请输入自定义值','error');return;}
  c[key]='manual:'+v;toast(`字段「${key}」已采用手动值`);render();
}

/* ============ 通用弹窗 ============ */
let modalEl=null;
function showModal(title,bodyHtml,actions){
  const mask=document.createElement('div');mask.className='pb-modal-mask';
  mask.innerHTML=`<div class="pb-modal pb-glass pb-glass--strong">
    <div class="pb-modal__head"><span class="pb-modal__title">${title}</span><button class="pb-iconbtn" data-act="cancel">✕</button></div>
    <div class="pb-modal__body">${bodyHtml}</div>
    <div class="pb-modal__foot">${actions.map((a,i)=>`<button class="pb-btn ${a.cls}" data-act="${i}">${a.label}</button>`).join('')}</div>
  </div>`;
  mask.addEventListener('click',e=>{
    const btn=e.target.closest('button[data-act]');
    if(!btn)return;
    const act=btn.getAttribute('data-act');
    if(act==='cancel'){closeModal();return;}
    actions[Number(act)].fn();
  });
  document.body.appendChild(mask);modalEl=mask;
}
function closeModal(){if(modalEl){modalEl.remove();modalEl=null;}}
