<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-page-node-id="hDeVS6hEyU413JS0Hc1OPw">
<head data-page-node-id="8QAIGjdeWXOySLbj3DQqRI">

<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="DGJGY65DH7zDnO8pwBA3dq">
<title>在线密码本 · 客户端原型</title>
<style>
:root{
  --font-sans:"HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","PingFang SC","Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","Cascadia Code",Consolas,monospace;
  --radius-sm:8px;--radius-md:12px;--radius-lg:18px;
  --dur:.24s;--ease:cubic-bezier(.22,1,.36,1);
}
:root[data-theme="dark"]{
  --bg-base:#070b14;--bg-grad-a:#0b1226;--bg-grad-b:#070b14;--bg-grad-c:#0a1a33;--bg-2:#0d1526;
  --glass-bg:rgba(255,255,255,.055);--glass-bg-strong:rgba(255,255,255,.09);
  --glass-border:rgba(255,255,255,.1);--glass-border-strong:rgba(255,255,255,.18);
  --text-1:#eef3fb;--text-2:rgba(238,243,251,.72);--text-3:rgba(238,243,251,.45);
  --accent:#38bdf8;--accent-2:#22d3ee;--accent-grad:linear-gradient(135deg,#38bdf8 0%,#22d3ee 100%);--accent-soft:rgba(56,189,248,.14);
  --success:#34d399;--warning:#fbbf24;--danger:#f87171;--info:#60a5fa;
  --success-soft:rgba(52,211,153,.14);--warning-soft:rgba(251,191,36,.14);--danger-soft:rgba(248,113,113,.14);
  --shadow-md:0 8px 32px rgba(0,0,0,.45);--shadow-glow:0 0 40px rgba(56,189,248,.12);
  --input-bg:rgba(255,255,255,.06);--hover:rgba(255,255,255,.09);--active:rgba(255,255,255,.13);
  --scroll-thumb:rgba(255,255,255,.16);--scroll-thumb-hover:rgba(255,255,255,.28);
}
:root[data-theme="light"]{
  --bg-base:#f2f5fb;--bg-grad-a:#fff;--bg-grad-b:#eef2f9;--bg-grad-c:#e6f0fb;--bg-2:#ffffff;
  --glass-bg:rgba(255,255,255,.62);--glass-bg-strong:rgba(255,255,255,.82);
  --glass-border:rgba(15,23,42,.09);--glass-border-strong:rgba(15,23,42,.16);
  --text-1:#0f1c2e;--text-2:rgba(15,28,46,.66);--text-3:rgba(15,28,46,.4);
  --accent:#0284c7;--accent-2:#0ea5e9;--accent-grad:linear-gradient(135deg,#0284c7 0%,#0ea5e9 100%);--accent-soft:rgba(2,132,199,.1);
  --success:#059669;--warning:#d97706;--danger:#dc2626;--info:#2563eb;
  --success-soft:rgba(5,150,105,.1);--warning-soft:rgba(217,119,6,.1);--danger-soft:rgba(220,38,38,.1);
  --shadow-md:0 8px 28px rgba(15,23,42,.1);--shadow-glow:0 0 36px rgba(14,165,233,.14);
  --input-bg:rgba(255,255,255,.75);--hover:rgba(15,23,42,.055);--active:rgba(15,23,42,.09);
  --scroll-thumb:rgba(15,23,42,.2);--scroll-thumb-hover:rgba(15,23,42,.32);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);color:var(--text-1);background:var(--bg-base);-webkit-font-smoothing:antialiased;overflow:hidden;font-size:14px;line-height:1.6}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;color:inherit;font-size:14px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* 通用组件 */
.pb-glass{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-lg);backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--shadow-md),var(--shadow-glow)}
.pb-glass--strong{background:var(--glass-bg-strong);border:1px solid var(--glass-border-strong)}
.pb-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 20px;border-radius:var(--radius-md);font-size:14px;font-weight:600;transition:all var(--dur) var(--ease);white-space:nowrap;border:1px solid transparent}
.pb-btn:disabled{opacity:.5;cursor:not-allowed}
.pb-btn--primary{background:var(--accent-grad);color:#fff;box-shadow:0 4px 18px rgba(56,189,248,.28)}
.pb-btn--primary:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06)}
.pb-btn--ghost{background:var(--glass-bg);border-color:var(--glass-border);color:var(--text-1)}
.pb-btn--ghost:hover{background:var(--hover);border-color:var(--glass-border-strong)}
.pb-btn--danger{background:var(--danger-soft);border-color:rgba(248,113,113,.35);color:var(--danger)}
.pb-btn--sm{height:32px;padding:0 14px;font-size:13px;border-radius:var(--radius-sm)}
.pb-btn--lg{height:46px;padding:0 28px;font-size:15px}
.pb-btn--block{width:100%}
.pb-iconbtn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);color:var(--text-2);transition:all var(--dur) var(--ease);font-size:15px}
.pb-iconbtn:hover{background:var(--hover);color:var(--text-1)}
.pb-field{display:flex;flex-direction:column;gap:6px}
.pb-label{font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:.02em}
.pb-input{width:100%;height:40px;padding:0 14px;border-radius:var(--radius-md);background:var(--input-bg);border:1px solid var(--glass-border);color:var(--text-1);font-size:14px;transition:all var(--dur) var(--ease)}
.pb-input::placeholder{color:var(--text-3)}
.pb-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pb-input:disabled{opacity:.55;cursor:not-allowed}
.pb-input--mono{font-family:var(--font-mono);font-size:13px}
/* 自绘下拉（替代原生 select，展开菜单可控样式） */
.pb-select{position:relative}
.pb-select__trigger{width:100%;height:40px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;border-radius:var(--radius-md);background:var(--input-bg);border:1px solid var(--glass-border);color:var(--text-1);font-size:14px;cursor:pointer;transition:all var(--dur) var(--ease)}
.pb-select__trigger:hover{border-color:var(--accent)}
.pb-select__trigger:disabled{opacity:.55;cursor:not-allowed}
.pb-select--open .pb-select__trigger{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pb-select__label{display:flex;align-items:center;gap:8px;min-width:0}
.pb-select__caret{color:var(--text-3);font-size:11px;flex-shrink:0;transition:transform var(--dur) var(--ease)}
.pb-select--open .pb-select__caret{transform:rotate(180deg)}
.pb-select__menu{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;max-height:240px;overflow-y:auto;padding:6px;border-radius:var(--radius-md);background:var(--bg-2);border:1px solid var(--glass-border);box-shadow:0 12px 32px rgba(0,0,0,.35);display:none;animation:pop .18s var(--ease)}
.pb-select--open .pb-select__menu{display:block}
.pb-select__opt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);font-size:13px;color:var(--text-2);cursor:pointer;transition:all var(--dur) var(--ease)}
.pb-select__opt:hover{background:var(--hover);color:var(--text-1)}
.pb-select__opt--on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pb-select__check{margin-left:auto;font-size:12px}
.pb-select__hint{font-size:11px;color:var(--text-3);padding:6px 10px 4px;border-top:1px dashed var(--glass-border);margin-top:4px}
.pb-input--lg{height:46px;font-size:15px}
.pb-input-group{position:relative;display:flex;align-items:center}
.pb-input-group .pb-input{padding-right:44px}
.pb-input-group__action{position:absolute;right:6px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);color:var(--text-3);transition:all var(--dur) var(--ease)}
.pb-input-group__action:hover{color:var(--text-1);background:var(--hover)}
.pb-badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pb-badge--success{background:var(--success-soft);color:var(--success)}
.pb-badge--warning{background:var(--warning-soft);color:var(--warning)}
.pb-badge--danger{background:var(--danger-soft);color:var(--danger)}
.pb-badge--neutral{background:var(--glass-bg-strong);color:var(--text-2);border:1px solid var(--glass-border)}
.pb-badge--accent{background:var(--accent-soft);color:var(--accent)}
.pb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.pb-dot--ok{background:var(--success);box-shadow:0 0 8px var(--success)}
.pb-dot--warn{background:var(--warning);box-shadow:0 0 8px var(--warning)}
.pb-dot--err{background:var(--danger);box-shadow:0 0 8px var(--danger)}
.pb-dot--idle{background:var(--text-3)}
.pb-divider{height:1px;background:var(--glass-border);border:none;margin:0}
.pb-mono{font-family:var(--font-mono)}
.pb-muted{color:var(--text-3)}
.pb-subtle{color:var(--text-2)}
.pb-sm{font-size:12.5px}
.pb-xs{font-size:11.5px}
.pb-bold{font-weight:700}
.pb-truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-fill{flex:1;min-width:0}
.pb-center{display:flex;align-items:center;justify-content:center}
.pb-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:56px 24px;color:var(--text-3);text-align:center}
.pb-empty__icon{font-size:42px;opacity:.7}
.pb-empty__title{font-size:15px;font-weight:600;color:var(--text-2)}
.pb-empty__desc{font-size:13px;max-width:320px;line-height:1.7}
.pb-spinner{width:18px;height:18px;border:2px solid var(--glass-border-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pb-modal-mask{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(4,8,16,.55);backdrop-filter:blur(6px);animation:fade var(--dur) var(--ease)}
.pb-modal{width:min(520px,calc(100vw-64px));max-height:calc(100vh-96px);display:flex;flex-direction:column;animation:pop .28s var(--ease)}
.pb-modal__head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 0}
.pb-modal__title{font-size:16px;font-weight:700}
.pb-modal__body{padding:20px 24px;overflow-y:auto;color:var(--text-2);display:flex;flex-direction:column;gap:16px}
.pb-modal__foot{display:flex;justify-content:flex-end;gap:10px;padding:0 24px 20px}
.pb-toast-wrap{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.pb-toast{display:flex;align-items:center;gap:10px;padding:11px 18px;border-radius:var(--radius-md);background:var(--glass-bg-strong);border:1px solid var(--glass-border-strong);box-shadow:var(--shadow-md);font-size:13.5px;font-weight:500;color:var(--text-1);animation:pop .3s var(--ease);pointer-events:auto}
.pb-toast--success{border-color:rgba(52,211,153,.45)}
.pb-toast--error{border-color:rgba(248,113,113,.45)}
.pb-toast--warn{border-color:rgba(251,191,36,.45)}

/* 外壳 / 标题栏 */
.shell{position:relative;height:100vh;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--bg-grad-a) 0%,var(--bg-grad-b) 48%,var(--bg-grad-c) 100%)}
.bg-glow{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.bg-glow--a{width:520px;height:520px;top:-180px;right:-120px;background:radial-gradient(circle,var(--accent) 0%,transparent 68%);opacity:.16}
.bg-glow--b{width:460px;height:460px;bottom:-160px;left:-120px;background:radial-gradient(circle,var(--accent-2) 0%,transparent 66%);opacity:.13}
.bg-grid{position:absolute;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--glass-border) 1px,transparent 1px),linear-gradient(90deg,var(--glass-border) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,rgba(0,0,0,.5),transparent 70%);mask-image:radial-gradient(ellipse at 50% 30%,rgba(0,0,0,.5),transparent 70%)}
.titlebar{position:relative;z-index:10;height:44px;display:flex;align-items:center;padding-left:16px;border-bottom:1px solid var(--glass-border);background:var(--glass-bg);backdrop-filter:blur(18px) saturate(140%);user-select:none;flex-shrink:0}
.titlebar__brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:.02em}
.titlebar__logo{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;background:var(--accent-grad);color:#fff;font-size:12px;box-shadow:0 2px 10px rgba(56,189,248,.4)}
.titlebar__tag{font-size:11px;font-weight:500;color:var(--text-3);letter-spacing:.06em;margin-left:4px}
.titlebar__drag{flex:1;height:100%}
.titlebar__controls{display:flex;align-items:center;gap:2px;padding-right:8px}
.titlebar__btn{width:40px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;color:var(--text-2);transition:all var(--dur) var(--ease)}
.titlebar__btn:hover{background:var(--hover);color:var(--text-1)}
.titlebar__btn--close:hover{background:#e11d48;color:#fff}
.autolock-bar{position:relative;z-index:10;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 12px;font-size:12.5px;color:var(--warning);background:var(--glass-bg);border-bottom:1px solid var(--glass-border)}
.stage{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column}
.stage-boot{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text-3);font-size:13.5px}

/* ============ 解锁页 ============ */
.unlock{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:1.1fr 1fr}
.unlock__left{overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:48px}
.unlock__hero{max-width:400px;display:flex;flex-direction:column;gap:8px;animation:pop .4s var(--ease)}
.unlock__logo{width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:26px;border-radius:16px;background:var(--accent-grad);box-shadow:0 8px 30px rgba(56,189,248,.35);margin-bottom:12px}
.unlock__title{font-size:32px;font-weight:800;letter-spacing:.01em}
.unlock__subtitle{font-size:15px;color:var(--text-2);margin-bottom:20px}
.unlock__feats{list-style:none;display:flex;flex-direction:column;gap:10px;font-size:13.5px;color:var(--text-2)}
.unlock__feats li{display:flex;align-items:center;gap:10px}
.feat-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);flex-shrink:0}
.unlock__right{overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:32px}
.unlock__card{margin:auto;width:100%;max-width:440px;padding:32px;display:flex;flex-direction:column;gap:16px;animation:pop .34s var(--ease)}
.unlock__card-head{display:flex;align-items:center;justify-content:space-between}
.unlock__card-head h2{font-size:19px;font-weight:700}
.unlock__section{display:flex;flex-direction:column;gap:10px}
.unlock__section-title{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--text-2)}
.unlock__saved-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-md);background:var(--glass-bg);border:1px solid var(--glass-border);font-size:13px}
.unlock__input-row{display:flex;gap:8px}
.unlock__input-row .pb-input{flex:1}
.unlock__hint{font-size:12px;color:var(--text-3);line-height:1.6}
.unlock__tip{display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:10px 12px;border-radius:var(--radius-md);line-height:1.6;word-break:break-all}
.unlock__tip--info{background:var(--accent-soft);color:var(--accent)}
.unlock__tip--ok{background:var(--success-soft);color:var(--success)}
.unlock__tip--err{background:var(--danger-soft);color:var(--danger)}
.unlock__skip{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:2px 0}
.unlock__import{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:var(--radius-md);border:1px dashed var(--glass-border-strong)}
.unlock__foot{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--text-3)}
.unlock__pub{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:var(--radius-md);background:var(--glass-bg);border:1px solid var(--glass-border)}
.unlock__readonly{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:var(--radius-md);background:var(--glass-bg);border:1px solid var(--glass-border);min-width:0}
.unlock__pub-row{display:flex;align-items:center;gap:8px;font-size:12px}
.unlock__autounlock{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border-radius:var(--radius-md);border:1px dashed var(--glass-border-strong)}
.unlock__seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:var(--radius-md);background:var(--input-bg);border:1px solid var(--glass-border)}
.unlock__seg button{height:34px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:var(--text-2);transition:all var(--dur) var(--ease)}
.unlock__seg button.on{background:var(--accent-soft);color:var(--accent)}
.unlock__seg button:not(.on):hover{background:var(--hover);color:var(--text-1)}
.unlock__regtabs{display:flex;gap:6px;margin-top:2px}
.unlock__regtabs button{height:28px;padding:0 12px;border-radius:99px;font-size:12.5px;color:var(--text-2);border:1px solid var(--glass-border);background:var(--glass-bg);transition:all var(--dur) var(--ease)}
.unlock__regtabs button.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.unlock__regresult{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--radius-md);border:1px solid var(--glass-border);background:var(--glass-bg)}
.unlock__regresult--ok{border-color:rgba(52,211,153,.4);background:var(--success-soft)}
.unlock__regresult--wait{border-color:rgba(251,191,36,.4);background:var(--warning-soft)}
.unlock__pubkey-box{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--radius-md);background:var(--input-bg);border:1px dashed var(--glass-border-strong)}
.unlock__pubkey-text{font-family:var(--font-mono);font-size:11.5px;word-break:break-all;color:var(--text-2);line-height:1.5}
.unlock__skip-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.unlock__modal-mask{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.unlock__modal{width:min(560px,92vw);max-height:86vh;overflow-y:auto;padding:20px;border-radius:12px;display:flex;flex-direction:column;gap:14px;animation:pop .3s var(--ease)}
.unlock__modal-title{margin:0 0 6px;font-size:16px;font-weight:700}
.unlock__modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

/* ============ 列表页 ============ */
.list-view{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px;gap:14px}
.list-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.list-toolbar__left{display:flex;flex:1}
.list-toolbar__right{display:flex;align-items:center;gap:8px}
.list-search{position:relative;width:min(420px,100%)}
.list-search__icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:15px;pointer-events:none}
.list-search__input{width:100%;height:38px;padding:0 14px 0 36px;border-radius:var(--radius-md);background:var(--input-bg);border:1px solid var(--glass-border);color:var(--text-1);font-size:13.5px;transition:all var(--dur) var(--ease)}
.list-search__input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.list-search__clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;display:none;align-items:center;justify-content:center;border-radius:50%;color:var(--text-3);font-size:12px}
.list-search__clear:hover{background:var(--active);color:var(--text-1)}
.list-search--filled .list-search__clear{display:inline-flex}
.list-body{flex:1;min-height:0;display:grid;grid-template-columns:320px 1fr;gap:14px}
.list-tree{display:flex;flex-direction:column;min-height:0}
.pb-glass--flat{box-shadow:none;backdrop-filter:blur(10px)}
.list-pane-title{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;font-size:13px;font-weight:700;letter-spacing:.03em;flex-shrink:0}
.list-tree__scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 8px 12px}
.pb-tree-node{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:var(--radius-sm);cursor:pointer;transition:all var(--dur) var(--ease);color:var(--text-2);font-size:13.5px;white-space:nowrap;position:relative}
.pb-tree-node:hover{background:var(--hover);color:var(--text-1)}
.pb-tree-node--active{background:var(--accent-soft);color:var(--text-1)}
.pb-tree-node--active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--accent)}
.pb-tree-node__quick{display:none;width:22px;height:22px;align-items:center;justify-content:center;border-radius:6px;font-size:12px;color:var(--text-3);flex-shrink:0}
.pb-tree-node:hover .pb-tree-node__quick{display:inline-flex}
.pb-tree-node__quick:hover{background:var(--active);color:var(--accent)}
.pb-tree-node--branch{font-weight:600;color:var(--text-1)}
.pb-tree-node--root{margin-top:6px}
.pb-tree-node--root:first-child{margin-top:0}
.pb-tree-node__arrow{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease);color:var(--text-3);font-size:10px;flex-shrink:0;border-radius:4px}
.pb-tree-node__arrow:hover{background:var(--active);color:var(--accent)}
.pb-tree-node__arrow--open{transform:rotate(90deg)}
.pb-tree-node__arrow--leaf{visibility:hidden}
.pb-tree-node__icon{font-size:15px;flex-shrink:0}
.pb-tree-node--leaf .pb-tree-node__icon{font-size:10px;opacity:.55;width:15px;text-align:center}
.pb-tree-children{position:relative}
.pb-tree-children::before{content:'';position:absolute;left:20px;top:0;bottom:6px;width:1px;background:var(--glass-border-strong)}
.pb-tree-node--leaf{font-size:13px}

/* ============ 方案 B：路径分组扁平列表 ============ */
.flat-list{flex:1;min-height:0;overflow-y:auto;padding:6px 8px 12px}
.flat-group{margin-bottom:4px}
.flat-group__head{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;cursor:pointer;border-radius:var(--radius-sm);color:var(--text-2);font-size:12.5px;font-weight:700;letter-spacing:.02em;transition:color var(--dur) var(--ease);position:sticky;top:0;background:var(--glass-bg);z-index:1}
.flat-group__head:hover{color:var(--text-1)}
.flat-group__head .pb-tree-node__arrow{font-size:9px}
.flat-group__path{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.flat-group__path .seg{white-space:nowrap;color:var(--text-3)}
.flat-group__path .seg-cur{color:var(--text-1)}
.flat-group__count{font-size:11px;font-weight:500;color:var(--text-3);flex-shrink:0}
.flat-item{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:var(--radius-sm);cursor:pointer;transition:all var(--dur) var(--ease);color:var(--text-2);font-size:13.5px;white-space:nowrap;position:relative}
.flat-item:hover{background:var(--hover);color:var(--text-1)}
.flat-item--active{background:var(--accent-soft);color:var(--text-1)}
.flat-item--active::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--accent)}
.flat-item__icon{font-size:14px;flex-shrink:0;width:16px;text-align:center}
.flat-item__title{font-weight:600}
.flat-item__sub{font-size:11.5px;color:var(--text-3);flex-shrink:0}
.flat-item__flags{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0}
.flat-item__flags .pb-badge{height:18px;padding:0 7px;font-size:10.5px}
.flat-empty{padding:24px 12px;text-align:center;color:var(--text-3);font-size:12.5px}

/* ============ 方案 E：三栏（侧栏导航 + 账号列表 + 详情） ============ */
.tri-view{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px;gap:12px}
.tri-body{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(320px,420px) 1fr;gap:12px}
.tri-nav{display:flex;flex-direction:column;min-height:0;padding:10px 8px;border-radius:var(--radius-lg);background:var(--glass-bg);border:1px solid var(--glass-border)}
.tri-nav__search{margin:0 4px 10px;position:relative}
.tri-nav__search input{width:100%;height:34px;padding:0 10px 0 30px;border-radius:var(--radius-md);background:var(--input-bg);border:1px solid var(--glass-border);color:var(--text-1);font-size:12.5px}
.tri-nav__search input:focus{outline:none;border-color:var(--accent)}
.tri-nav__search .list-search__icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:13px;pointer-events:none}
.tri-nav__title{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--text-3);padding:2px 10px 6px;text-transform:uppercase}
.tri-nav__list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.tri-nav__item{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:var(--radius-sm);font-size:13px;color:var(--text-2);cursor:pointer;transition:all var(--dur) var(--ease)}
.tri-nav__item:hover{background:var(--hover);color:var(--text-1)}
.tri-nav__item--on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tri-nav__item .cnt{margin-left:auto;font-size:11px;color:var(--text-3)}
.tri-nav__foot{padding:8px 6px 2px;border-top:1px dashed var(--glass-border);display:flex;flex-direction:column;gap:2px}
.tri-list{display:flex;flex-direction:column;min-height:0;padding:6px 0 8px;border-radius:var(--radius-lg);background:var(--glass-bg);border:1px solid var(--glass-border)}
.tri-list__head{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;flex-shrink:0}
.tri-list__title{font-size:13px;font-weight:700}
.tri-list__count{font-size:11.5px;color:var(--text-3)}
.tri-list__body{flex:1;min-height:0;overflow-y:auto;padding:0 6px}
.tri-row{display:flex;align-items:center;gap:10px;height:42px;padding:0 10px;border-radius:var(--radius-md);cursor:pointer;transition:all var(--dur) var(--ease);position:relative}
.tri-row:hover{background:var(--hover)}
.tri-row--active{background:var(--accent-soft)}
.tri-row--active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.tri-row__main{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1;gap:1px}
.tri-row__title{font-size:13.5px;font-weight:600;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tri-row__sub{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-mono)}
.tri-row__dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tri-row__dot--warn{background:var(--warning);box-shadow:0 0 6px var(--warning)}
.tri-row__dot--danger{background:var(--danger);box-shadow:0 0 6px var(--danger)}
@media (max-width:1100px){.tri-body{grid-template-columns:180px minmax(280px,1fr) 1.2fr}}

/* ============ 方案 J：项目 tab + 子树 + 下属列表 ============ */
.pj-view{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 16px;gap:12px}
.pj-tabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--glass-border);flex-shrink:0;overflow-x:auto}
.pj-tab{height:36px;padding:0 16px;border-radius:8px 8px 0 0;font-size:13.5px;color:var(--text-2);cursor:pointer;transition:all var(--dur) var(--ease);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.pj-tab:hover{color:var(--text-1);background:var(--hover)}
.pj-tab--on{color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}
.pj-tab--new{color:var(--text-3);font-size:12.5px}
.pj-toolbar{display:flex;align-items:center;gap:10px;flex-shrink:0}
.pj-toolbar__right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pj-body{flex:1;min-height:0;display:grid;grid-template-columns:220px 1fr;gap:12px}
.pj-subtree{display:flex;flex-direction:column;min-height:0;padding:8px 6px;border-radius:var(--radius-lg);background:var(--glass-bg);border:1px solid var(--glass-border);overflow-y:auto}
.pj-subtree__title{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--text-3);padding:4px 10px 6px;text-transform:uppercase}
.pj-tree-row{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:var(--radius-sm);font-size:12.5px;color:var(--text-2);cursor:pointer;transition:all var(--dur) var(--ease)}
.pj-tree-row:hover{background:var(--hover);color:var(--text-1)}
.pj-tree-row--on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pj-tree-row__caret{width:14px;flex-shrink:0;font-size:9px;color:var(--text-3);text-align:center}
.pj-tree-row__cnt{margin-left:auto;font-size:10.5px;color:var(--text-3)}
.pj-pane{display:flex;flex-direction:column;min-height:0;padding:10px 12px;border-radius:var(--radius-lg);background:var(--glass-bg);border:1px solid var(--glass-border)}
.pj-pane__head{display:flex;align-items:center;gap:10px;padding:2px 4px 8px;flex-shrink:0;flex-wrap:wrap}
.pj-pane__title{font-size:14px;font-weight:700}
.pj-pane__sub{font-size:12px;color:var(--text-3)}
.pj-pane__right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pj-colcfg-btn{height:28px;padding:0 10px;border-radius:var(--radius-sm);font-size:12px;color:var(--text-2);background:var(--input-bg);border:1px solid var(--glass-border);cursor:pointer;transition:all var(--dur) var(--ease)}
.pj-colcfg-btn:hover{color:var(--text-1);border-color:var(--accent)}
.pj-pane__body{flex:1;min-height:0;overflow-y:auto}
.pj-table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.pj-table th{text-align:left;padding:7px 10px;font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--glass-border);white-space:nowrap}
.pj-table td{padding:8px 10px;border-bottom:1px solid var(--glass-border);vertical-align:top;color:var(--text-1)}
.pj-table tr:hover td{background:var(--hover)}
.pj-mono{font-family:var(--font-mono)}
.pj-ssh{display:inline-flex;align-items:center;gap:4px;max-width:100%;min-width:0}
.pj-ssh__cmd{font-family:var(--font-mono);font-size:11.5px;background:var(--input-bg);border-radius:4px;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj-chips{display:inline-flex;gap:5px;flex-wrap:wrap;max-width:100%}
.pj-chip{font-family:var(--font-mono);font-size:11.5px;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:4px;padding:2px 8px;cursor:pointer;transition:all var(--dur) var(--ease);white-space:nowrap}
.pj-chip:hover{border-color:var(--accent);color:var(--accent)}
.pj-chip--more{cursor:default;color:var(--text-3)}
.pj-chip--more:hover{border-color:var(--glass-border);color:var(--text-3)}
.pj-colcfg-pop{position:relative;display:inline-block}
.pj-colcfg-panel{position:absolute;right:0;top:34px;z-index:50;width:260px;padding:10px 12px;border-radius:var(--radius-md);background:var(--bg-2);border:1px solid var(--glass-border);box-shadow:0 12px 32px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:6px}
.pj-colcfg-panel__title{font-size:12px;font-weight:600;color:var(--text-1);padding:2px 0 4px}
.pj-colcfg-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);padding:3px 2px;cursor:pointer;border-radius:4px}
.pj-colcfg-row:hover{background:var(--hover)}
.pj-colcfg-row input{accent-color:var(--accent)}
.pj-colcfg-hint{font-size:11px;color:var(--text-3);border-top:1px dashed var(--glass-border);padding-top:6px;line-height:1.5}
.pj-detail-btn{height:24px;padding:0 8px;border-radius:4px;font-size:11.5px;color:var(--accent);background:var(--accent-soft);border:none;cursor:pointer;white-space:nowrap;transition:all var(--dur) var(--ease)}
.pj-detail-btn:hover{filter:brightness(1.15)}
.pj-empty{padding:32px 16px;text-align:center;color:var(--text-3);font-size:12.5px}
.pj-tree-row{position:relative}
.pj-tree-row__quick{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:20px;height:20px;display:none;align-items:center;justify-content:center;border-radius:4px;color:var(--accent);font-size:12px;background:var(--accent-soft);cursor:pointer;flex-shrink:0}
.pj-tree-row:hover .pj-tree-row__quick{display:inline-flex}
.pj-tree-row:hover .pj-tree-row__cnt{visibility:hidden}
.pj-add-row{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-top:6px;border-radius:var(--radius-md);border:1px dashed var(--glass-border);color:var(--text-3);font-size:12px;cursor:pointer;transition:all var(--dur) var(--ease)}
.pj-add-row:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.edit-parent{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.edit-parent .pb-select__trigger{height:36px;font-size:13px}
.edit-parent__chain{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.edit-parent__chain b{color:var(--text-1);font-weight:600}
.edit-parent select:disabled{cursor:not-allowed;opacity:.65}
.edit-parent__chain{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.edit-parent__chain b{color:var(--text-1);font-weight:600}
@media (max-width:1100px){.pj-body{grid-template-columns:180px 1fr}}
/* ============ 工作台 ============ */
.wb-view{flex:1;min-height:0;overflow-y:auto;padding:20px 28px;display:flex;flex-direction:column;gap:18px}
.wb-hero{display:flex;align-items:center;gap:14px}
.wb-hero__search{position:relative;flex:1;max-width:520px}
.wb-hero__search input{width:100%;height:40px;padding:0 14px 0 36px;border-radius:var(--radius-md);background:var(--input-bg);border:1px solid var(--glass-border);color:var(--text-1);font-size:13.5px}
.wb-hero__search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.wb-hero__search .list-search__icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:15px;pointer-events:none}
.wb-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.wb-stat{padding:14px 16px;border-radius:var(--radius-lg);background:var(--glass-bg);border:1px solid var(--glass-border);cursor:pointer;transition:all var(--dur) var(--ease)}
.wb-stat:hover{border-color:var(--accent);transform:translateY(-1px)}
.wb-stat__label{font-size:12px;color:var(--text-3);margin-bottom:4px}
.wb-stat__value{font-size:24px;font-weight:700;color:var(--text-1)}
.wb-stat__value--warn{color:var(--warning)}
.wb-stat__value--danger{color:var(--danger)}
.wb-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.wb-card{padding:14px 16px;border-radius:var(--radius-lg);background:var(--glass-bg);border:1px solid var(--glass-border);display:flex;flex-direction:column;gap:10px;min-height:0}
.wb-card__title{font-size:13px;font-weight:700;color:var(--text-1)}
.wb-env{display:flex;flex-direction:column;gap:6px}
.wb-env__proj{font-size:12.5px;color:var(--text-2);font-weight:600;padding:2px 0}
.wb-env__chips{display:flex;gap:6px;flex-wrap:wrap}
.wb-env__chip{font-size:12px;color:var(--text-2);background:var(--input-bg);border:1px solid var(--glass-border);border-radius:6px;padding:4px 10px;cursor:pointer;transition:all var(--dur) var(--ease)}
.wb-env__chip:hover{border-color:var(--accent);color:var(--accent)}
.wb-recent{display:flex;flex-direction:column}
.wb-recent__row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:var(--radius-sm);cursor:pointer;transition:all var(--dur) var(--ease)}
.wb-recent__row:hover{background:var(--hover)}
.wb-recent__name{font-family:var(--font-mono);font-size:12.5px;color:var(--text-1);font-weight:600}
.wb-recent__meta{font-size:11.5px;color:var(--text-3);margin-left:auto;white-space:nowrap}
.wb-quick{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:1100px){.wb-grid{grid-template-columns:1fr}.wb-stats{grid-template-columns:repeat(2,1fr)}}
.list-detail{min-height:0;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.detail-head__title{display:flex;align-items:center;gap:12px}
.detail-head__icon{font-size:22px}
.detail-head__title h2{font-size:20px;font-weight:700}
.detail-head__badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.detail-meta{letter-spacing:.02em}
.detail-field{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--radius-md);background:var(--glass-bg);border:1px solid var(--glass-border)}
.detail-field__label{font-size:12.5px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}
.detail-field__value{display:flex;align-items:center;gap:8px;min-width:0}
.detail-field__reveal{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--text-3);font-size:13px;flex-shrink:0}
.detail-field__reveal:hover{background:var(--active);color:var(--text-1)}
.detail-children{display:flex;flex-direction:column;gap:6px}
.detail-child{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-md);background:var(--glass-bg);border:1px solid var(--glass-border);font-size:13.5px}
.detail-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ============ 编辑页 ============ */
.edit-view{flex:1;min-height:0;overflow-y:auto;padding:24px;display:flex;justify-content:center}
.edit-card{width:100%;max-width:560px;height:fit-content;display:flex;flex-direction:column;padding:20px 24px;gap:14px;animation:pop .28s var(--ease)}
.edit-head{display:flex;align-items:center;gap:10px}
.edit-head h2{font-size:17px;font-weight:700}
.edit-body{display:flex;flex-direction:column;gap:14px}
.edit-error{padding:10px 12px;border-radius:var(--radius-md);background:var(--danger-soft);color:var(--danger);font-size:13px}
.edit-note{padding:16px;border-radius:var(--radius-md);background:var(--glass-bg);border:1px dashed var(--glass-border-strong);text-align:center;color:var(--text-2);font-size:13.5px}

/* ============ 设置页 ============ */
.settings{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px;gap:14px}
.settings-head{display:flex;align-items:center;gap:16px;flex-shrink:0}
.settings-head h2{font-size:19px;font-weight:700}
.settings-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:2px}
.settings-card{display:flex;flex-direction:column;gap:14px;padding:18px 20px;flex-shrink:0;border-radius:var(--radius-lg);background:var(--glass-bg);border:1px solid var(--glass-border)}
.settings-card__head{display:flex;align-items:flex-start;gap:12px}
.settings-card__icon{font-size:20px;line-height:1.4}
.settings-card__head h3{font-size:15px;font-weight:700}
.settings-card__body{display:flex;flex-direction:column;gap:12px;padding-left:32px}
.settings-row{display:flex;gap:8px}
.settings-row .pb-input{flex:1}
.settings-tip{font-size:13px;padding:9px 12px;border-radius:var(--radius-md);line-height:1.6;word-break:break-all}
.settings-tip--info{background:var(--accent-soft);color:var(--accent)}
.settings-tip--ok{background:var(--success-soft);color:var(--success)}
.settings-tip--err{background:var(--danger-soft);color:var(--danger)}
.settings-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.settings-syncmode{display:flex;flex-direction:column;gap:8px}
.settings-syncmode__options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.settings-syncmode__opt{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:var(--radius-md);border:1px solid var(--glass-border);background:var(--glass-bg);cursor:pointer;transition:border-color .15s,background .15s}
.settings-syncmode__opt.on{border-color:var(--accent);background:var(--accent-soft)}

/* ============ 方案 B：扁平分组列表 ============ */
function entityList(){
  // 实体 = account / custom；取祖先路径（项目 › 环境 › [IP类型 › 账号类型]）
  return entries.filter(e=>e.type==='account'||e.type==='custom').map(e=>{
    const path=[];
    let p=e.parent_id;
    while(p){const node=entries.find(x=>x.id===p);if(!node)break;path.unshift(node);p=node.parent_id;}
    return {entry:e,path};
  });
}
function renderFlatList(){
  const list=entityList();
  const sel=entries.find(e=>e.id===selectedId)||null;
  // 分组键：项目 › 环境（IP类型/账号类型并入组内副标题）
  const groups=new Map();
  for(const it of list){
    const proj=it.path.find(n=>n.type==='project');
    const env=it.path.find(n=>n.type==='env');
    const key=(proj?.title||'未分组')+' › '+(env?.title||'—');
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(it);
  }
  const collKey='__collapsedGroups';
  window[collKey]=window[collKey]||new Set();
  const collapsed=window[collKey];
  const kw=(window._searchKw||'').toLowerCase();
  function matchIt(it){
    if(!kw)return true;
    const hay=[it.entry.title,...Object.values(it.entry.fields||{}),...Object.values(it.entry.custom_fields||{}),...it.path.map(n=>n.title)].join('\n').toLowerCase();
    return hay.includes(kw);
  }
  const groupHtml=[...groups.entries()].map(([key,items])=>{
    const vis=items.filter(matchIt);
    if(!vis.length)return '';
    const [projName,envName]=key.split(' › ');
    const isCollapsed=!kw&&collapsed.has(key);
    const cnt=vis.length;
    return `
    <div class="flat-group">
      <div class="flat-group__head" onclick="toggleFlatGroup('${esc(key)}')">
        <span class="pb-tree-node__arrow ${isCollapsed?'':'pb-tree-node__arrow--open'}">▶</span>
        <span class="flat-group__path"><span class="seg">🗂 ${esc(projName)}</span><span class="seg">/</span><span class="seg-cur">${esc(envName)}</span></span>
        <span class="flat-group__count">${cnt} 条</span>
      </div>
      ${isCollapsed?'':vis.map(it=>{
        const e=it.entry;
        const ipType=it.path.find(n=>n.type==='ip_type')?.title;
        const accType=it.path.find(n=>n.type==='acc_type')?.title;
        const ip=e.fields?.ip||e.custom_fields?.ip||'';
        const sub=[ipType,accType,ip].filter(Boolean).join(' · ');
        return `
        <div class="flat-item ${e.id===selectedId?'flat-item--active':''}" data-node-id="${e.id}" onclick="selectNode('${e.id}')">
          <span class="flat-item__icon">${typeMeta[e.type]?.icon||'📄'}</span>
          <span class="flat-item__title">${esc(e.title)}</span>
          ${sub?`<span class="flat-item__sub">${esc(sub)}</span>`:''}
          <span class="flat-item__flags">
            ${e.dirty?'<span class="pb-badge pb-badge--warning">未推送</span>':''}
            ${e.conflict_of?'<span class="pb-badge pb-badge--danger">冲突</span>':''}
          </span>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
  return {html:groupHtml||`<div class="flat-empty">无匹配条目</div>`,sel,count:list.length};
}
function toggleFlatGroup(key){
  const collapsed=window.__collapsedGroups=window.__collapsedGroups||new Set();
  if(collapsed.has(key))collapsed.delete(key);else collapsed.add(key);
  render();
}

/* ============ 列表页（方案 E 主视图：三栏） ============ */

/* ============ 方案 J：列表页（项目 tab + 子树 + 下属列表） ============ */

window._colCfgOpen=false;  /* 列配置弹层开关 */
function renderList(){
  const projects=entries.filter(e=>e.type==='project');
  let proj=projects.find(p=>p.id===window._pjProject)||projects[0]||null;
  if(proj)window._pjProject=proj.id;

  /* ---- 左树数据：环境 → IP（聚合 account.fields.ip） ---- */
  const envs=entries.filter(e=>e.type==='env'&&e.parent_id===proj?.id);
  function envAccounts(envId){
    const out=[];(function walk(pid){for(const e of entries){if(e.parent_id===pid){if(e.type==='account'||e.type==='custom')out.push(e);walk(e.id);}}})(envId);
    return out;
  }
  function ipGroups(envId){

    for(const a of accs){const ip=a.fields?.ip||'（未填 IP）';if(!m.has(ip))m.set(ip,[]);m.get(ip).push(a);}
    return [...m.entries()].map(([ip,list])=>({ip,accounts:list}));
  }
  const focus=window._pjFocusNode&&entries.find(e=>e.id===window._pjFocusNode)?window._pjFocusNode:null;

        <span class="pj-mono pb-truncate" style="font-size:11.5px">${esc(g.ip)}</span>
        <span class="pj-tree-row__cnt">${g.accounts.filter(a=>a.type==='account').length}</span>
        <span class="pj-tree-row__quick" title="在此 IP 新建账号" onclick="event.stopPropagation();pjQuickAdd('${env.id}','${esc(g.ip)}')">＋</span>
      </div>`;}).join(''):''}`;
  }).join('');

  /* ---- 右侧面板内容（按选中节点层级自适应） ---- */
  let paneTitle='',paneSub='',rowsHtml='';
  const kw=(window._searchKw||'').toLowerCase();
  function kwHit(...vals){if(!kw)return true;return vals.join('\n').toLowerCase().includes(kw);}
  window._pjSshUser=accs=>accs.find(a=>a.fields?.username==='root')||accs[0];

  if(window._pjIpFocus){ /* 选中的是某个 IP（优先判断） */
    const ip=window._pjIpFocus.ip;

    paneTitle=ip+' · 账号清单';
    paneSub=`${accs.length} 个账号`;
    rowsHtml=pjAccountTable(accs,cfg);
  }else if(focus){ /* 选中的是环境 */
    const env=entries.find(e=>e.id===focus);
    const groups=ipGroups(focus).filter(g=>kwHit(g.ip,...g.accounts.map(a=>a.title+' '+(a.fields?.username||'')+' '+(a.fields?.remark||''))));
    paneTitle=env.title+' · IP 清单';
    paneSub=`${groups.length} 个 IP · ${groups.reduce((s,g)=>s+g.accounts.filter(a=>a.type==='account').length,0)} 个账号`;

    }).filter(r=>kwHit(r.env.title));

        <div class="pj-colcfg-panel__title">列显示（保存到此节点 · 仅本地）</div>
        ${[...allCols,...extCols].map(c=>`
        <label class="pj-colcfg-row"><input type="checkbox" ${cfg.cols.includes(c)?'checked':''} onchange="pjToggleCol('${c}')"><span>${colLabels[c]}</span></label>`).join('')}
        <div class="pj-colcfg-hint">配置保存在本机（不上传服务器、不参与同步）</div>
      </div>
    </div>`:'';

  /* ---- 上下文感知的新建按钮 ---- */
  let newBtnLabel='＋ 新建账号',newBtnFn='startNew()';
  if(window._pjIpFocus){newBtnLabel='＋ 在此 IP 新建账号';newBtnFn='pjStartNewCtx()';}
  else if(focus){newBtnLabel='＋ 在此环境新建账号';newBtnFn='pjStartNewCtx()';}
  else if(proj){newBtnLabel='＋ 新建环境';newBtnFn='pjStartNewCtx()';}

  stage.innerHTML=`
  <div class="pj-view">
    <div class="pj-tabs">
      ${projects.map(p=>`<div class="pj-tab ${p.id===proj?.id?'pj-tab--on':''}" onclick="pjSwitchProject('${p.id}')">${esc(p.title)}</div>`).join('')}
      <div class="pj-tab pj-tab--new" onclick="toast('原型：新建项目','info')">＋ 新项目</div>
    </div>
    <div class="pj-toolbar">
      <div class="pj-toolbar__right">

      </div>

      </div>

  </div>`;

/* 上下文感知新建：根据当前选中节点带 parent + ip 预填 */
function pjStartNewCtx(){

  }else if(window._pjFocusNode){
    window._newCtx={type:'account',parentEnvId:window._pjFocusNode};

    window._newCtx={type:'env',parentProjId:window._pjProject};

  selectedId=null;goto('edit');

/* IP 表：每行 = IP + 关联信息 + SSH + 账号 chips + 详情 */
function pjIpTable(groups,cfg){
  if(!groups.length)return `<div class="pj-empty">无匹配 IP<br><span style="font-size:11.5px">左侧选择环境后，点 <b style="color:var(--accent)">＋</b> 可在此环境新建账号</span></div>`;
  const has=c=>cfg.cols.includes(c);
  const head=`<tr>${has('ip')?'<th style="width:110px">IP</th>':''}${has('info')?'<th>关联信息</th>':''}${has('ssh')?'<th style="width:170px">快速 SSH 命令</th>':''}${has('accounts')?'<th>账号（点击查看密码）</th>':''}${has('port')?'<th style="width:70px">端口</th>':''}${has('remark')?'<th>备注</th>':''}${has('updated')?'<th style="width:130px">最后修改</th>':''}<th style="width:56px"></th></tr>`;
  const rows=groups.map(g=>{
    const accs=g.accounts.filter(a=>a.type==='account');
    const main=window._pjSshUser(accs);
    const info=accs.map(a=>a.fields?.remark||'').filter(Boolean)[0]||'';
    const port=accs.map(a=>a.fields?.port||'').filter(Boolean)[0]||'—';
    const remark=accs.map(a=>a.fields?.remark||'').filter(Boolean).join('；');
    const latest=Math.max(...g.accounts.map(a=>a.updated_at||0));
    const dirty=g.accounts.some(a=>a.dirty||a.conflict_of);
    return `<tr>
      ${has('ip')?`<td class="pj-mono">${esc(g.ip)}${dirty?' <span class="tri-row__dot tri-row__dot--warn" style="display:inline-block;vertical-align:middle"></span>':''}</td>`:''}
      ${has('info')?`<td style="color:var(--text-2)">${esc(info||'—')}</td>`:''}
      ${has('ssh')?`<td><span class="pj-ssh"><span class="pj-ssh__cmd">ssh ${esc(main?.fields?.username||'root')}@${esc(g.ip)}</span><button class="pb-iconbtn" style="width:22px;height:22px;font-size:12px" title="复制命令" onclick="toast('已复制，30 秒后自动清空')">⧉</button></span></td>`:''}
      ${has('accounts')?`<td><span class="pj-chips">${accs.slice(0,4).map(a=>`<span class="pj-chip" onclick="pjShowAccount('${a.id}')" title="${esc(a.fields?.remark||a.title)}">${esc(a.fields?.username||a.title)}</span>`).join('')}${accs.length>4?`<span class="pj-chip pj-chip--more">+${accs.length-4}</span>`:''}</span></td>`:''}
      ${has('port')?`<td class="pj-mono" style="color:var(--text-2)">${esc(port)}</td>`:''}
      ${has('remark')?`<td style="color:var(--text-2)">${esc(remark||'—')}</td>`:''}
      ${has('updated')?`<td style="color:var(--text-3);font-size:11.5px">${fmtTime(latest)}</td>`:''}
      <td><button class="pj-detail-btn" onclick="pjShowIpDetail('${esc(g.ip)}')">详情</button></td>
    </tr>`;
  }).join('');
  return `<table class="pj-table">${head}${rows}</table>`;
}

function pjAccountTable(accs,cfg){

function pjFocus(id){window._pjFocusNode=id;window._pjIpFocus=null;render();}
function pjFocusIp(ip,envId){
  const accs=[];(function walk(pid){for(const e of entries){if(e.parent_id===pid){if(e.type==='account'||e.type==='custom')accs.push(e);walk(e.id);}}})(envId);
  const list=accs.filter(a=>(a.fields?.ip||'（未填 IP）')===ip);

function pjToggleCfgPanel(){window._colCfgOpen=!window._colCfgOpen;render();}
function pjToggleCol(col){
  /* 节点级 key：与 renderList 的 colCfgKey 规则一致 */
  const key=window._pjIpFocus?('pj_colcfg_ip_'+window._pjIpFocus.ip):('pj_colcfg_'+(window._pjFocusNode||window._pjProject||'__all'));
  let cfg;try{cfg=JSON.parse(window._pjColCfgStore?.[key]||'null');}catch(e){cfg=null;}

function renderListTree(){
  const roots=buildTree(null);
  const sel=findNode(roots,selectedId)||roots[0]||null;
  if(sel)selectedId=sel.entry.id;
  function depthOf(id){let d=0,p=entries.find(x=>x.id===id)?.parent_id;while(p){d++;p=entries.find(x=>x.id===p)?.parent_id;}return d;}
  function treeHtml(nodes){
    return nodes.map(n=>{
      const e=n.entry;const isOpen=expanded.includes(e.id);const hasCh=n.children.length>0;
      const isBranch=hasCh||['project','env','ip_type','acc_type'].includes(e.type);
      const depth=depthOf(e.id);
      const row=`
        <div class="pb-tree-node ${e.id===selectedId?'pb-tree-node--active':''} ${isBranch?'pb-tree-node--branch':'pb-tree-node--leaf'} ${depth===0?'pb-tree-node--root':''}" data-node-id="${e.id}" style="padding-left:${12+depth*14}px" onclick="selectNode('${e.id}')">
          <span class="pb-tree-node__arrow ${isOpen?'pb-tree-node__arrow--open':''} ${!hasCh?'pb-tree-node__arrow--leaf':''}" ${hasCh?`onclick="event.stopPropagation();toggleNode('${e.id}')"`:''}>▶</span>
          <span class="pb-tree-node__icon">${typeMeta[e.type]?.icon||'📄'}</span>

          ${['project','env','ip_type','acc_type'].includes(e.type)?`<button class="pb-tree-node__quick" title="新建子项" onclick="event.stopPropagation();newChild('${e.id}')">＋</button>`:''}
          ${e.dirty?'<span class="pb-dot pb-dot--warn" title="未推送"></span>':''}
          ${e.conflict_of?'<span class="pb-badge pb-badge--danger" style="height:18px;padding:0 8px;font-size:11px">冲突</span>':''}
        </div>`;
      const ch=isOpen&&hasCh?`<div class="pb-tree-children">${treeHtml(n.children)}</div>`:'';
      return row+ch;
    }).join('');
  }
  function detailHtml(n){

/* ============ 自绘下拉组件（替代原生 select，风格统一） ============ */
/* 用法：pbSelect(id, options, selectedId, onPickFnName, {disabled, hint})
   options: [{value, label, icon}]  onPickFnName: 全局函数名，参数 (value) */
window._pbSelectState=window._pbSelectState||{};   /* id -> {open, value, opts} */
function pbSelect(id,opts,selected,onPick,extra){
  const st=window._pbSelectState[id]=window._pbSelectState[id]||{open:false,value:selected};
  st.opts=opts;   /* 供局部刷新取 label/icon */
  if(st.value===undefined||!opts.some(o=>o.value===st.value))st.value=selected;
  const ex=extra||{};
  const cur=opts.find(o=>o.value===st.value);
  return `
  <div class="pb-select ${st.open?'pb-select--open':''}" id="${id}" data-cur="${esc(st.value)}">
    <button type="button" class="pb-select__trigger" ${ex.disabled?'disabled':''} onclick="pbSelectToggle('${id}')">
      <span class="pb-select__label">${cur?.icon?`<span>${cur.icon}</span>`:''}<span class="pb-truncate" data-role="cur-label">${esc(cur?.label||'请选择')}</span></span>
      <span class="pb-select__caret">▾</span>
    </button>
    <div class="pb-select__menu">
      ${opts.map(o=>`
      <div class="pb-select__opt ${o.value===st.value?'pb-select__opt--on':''}" data-val="${esc(o.value)}" onclick="pbSelectPick('${id}','${esc(o.value)}','${onPick}')">
        ${o.icon?`<span>${o.icon}</span>`:''}<span class="pb-truncate">${esc(o.label)}</span>
        ${o.value===st.value?'<span class="pb-select__check">✓</span>':''}
      </div>`).join('')}
      ${ex.hint?`<div class="pb-select__hint">${esc(ex.hint)}</div>`:''}
    </div>
  </div>`;
}
function pbSelectToggle(id){
  /* 单开互斥：关掉其他 */
  let dirty=false;
  for(const k in window._pbSelectState){if(k!==id&&window._pbSelectState[k].open){window._pbSelectState[k].open=false;dirty=true;}}
  window._pbSelectState[id].open=!window._pbSelectState[id].open;
  /* 局部更新：只刷受影响的组件 DOM，避免整页重渲重放入场动画 */
  if(dirty)for(const k in window._pbSelectState)pbSelectRefresh(k);
  pbSelectRefresh(id);
}
function pbSelectPick(id,value,onPick){
  window._pbSelectState[id].value=value;
  window._pbSelectState[id].open=false;
  if(onPick)window[onPick](value);
  /* 类型切换会改变表单结构、项目切换会联动环境下拉 → 需整页重渲 */
  const affectsLayout=(onPick==='pjEditParentChain2'||onPick==='pjEditTypeChange');
  if(affectsLayout){
    window._skipEntryAnim=true;   /* 重渲后抑制编辑卡入场动画（防闪） */
    render();
    window._skipEntryAnim=false;
    return;
  }
  pbSelectRefresh(id);
}
/* 只重绘单个下拉组件（不重建 DOM，避免重放入场动画） */
function pbSelectRefresh(id){
  const el=document.getElementById(id);
  if(!el)return;
  const st=window._pbSelectState[id]||{};
  el.classList.toggle('pb-select--open',!!st.open);
  /* 更新触发器当前值 */
  const cur=(st.opts||[]).find(o=>o.value===st.value);
  const labelEl=el.querySelector('[data-role="cur-label"]');
  if(labelEl&&cur)labelEl.textContent=cur.label;
  const iconEl=el.querySelector('.pb-select__label > span:first-child');
  if(iconEl&&cur)iconEl.textContent=cur.icon||'';
  /* 更新选中项高亮 */
  el.querySelectorAll('.pb-select__opt').forEach(opt=>{
    const on=opt.getAttribute('data-val')===String(st.value);
    opt.classList.toggle('pb-select__opt--on',on);
    let chk=opt.querySelector('.pb-select__check');
    if(on&&!chk){chk=document.createElement('span');chk.className='pb-select__check';chk.textContent='✓';opt.appendChild(chk);}
    if(!on&&chk)chk.remove();
  });
}
/* 点击组件外部关闭 */
document.addEventListener('click',e=>{
  if(!e.target.closest('.pb-select')){
    let dirty=false;
    for(const k in window._pbSelectState){if(window._pbSelectState[k].open){window._pbSelectState[k].open=false;dirty=true;}}
    if(dirty)for(const k in window._pbSelectState)pbSelectRefresh(k);
  }
});

        <div class="conflict-resolve__quick">

        </div>
      </div>
      ${['password','ip','port'].map(k=>{
        const c=choices[k];
        const active=cls=>c===cls?'conflict-resolve__active':'';
        const manualVal=c&&c.startsWith('manual:')?c.slice(7):'';
        return `<div class="conflict-resolve__row">
          <span class="conflict-resolve__key">${k}</span>
          <div class="conflict-resolve__opts">

            ${c&&c.startsWith('manual:')?`

      }).join('')}
    </div>
    <div class="conflict-actions">

    </div>

  </div>`;
}
function resolveConflict(){toast('冲突已解决，变更将同步到服务端');goto('list');}
function pickSide(key,side){
  const c=window._conflictChoices||{};
  if(side==='manual'){c[key]='manual:';render();}
  else{c[key]=side;render();}
}
function confirmManual(key){
  const c=window._conflictChoices||{};

  if(!v){toast('请输入自定义值','error');return;}

}

          <div class="settings-info-row settings-info-row--col"><span class="settings-info-row__label">私钥备份</span>
            <div class="settings-autounlock"><span class="pb-subtle pb-sm">导出私钥备份（.key，口令加密）用于新设备恢复登录</span><button class="pb-btn pb-btn--ghost" onclick="toast('私钥备份已保存','success')">💾 导出私钥备份</button></div></div>
          <div class="settings-actions"><button class="pb-btn pb-btn--ghost pb-btn--sm" onclick="goto('unlock')">⏻ 立即锁定</button></div>
        </div>
      </section>
    </div>
  </div>`;
}
function setTheme(t){theme=t;document.documentElement.setAttribute('data-theme',t);render();}

/* ============ 通用弹窗 ============ */
let modalEl=null;
function showModal(title,bodyHtml,actions){
  const mask=document.createElement('div');mask.className='pb-modal-mask';
  mask.innerHTML=`<div class="pb-modal pb-glass pb-glass--strong">
    <div class="pb-modal__head"><span class="pb-modal__title">${title}</span><button class="pb-iconbtn" data-act="cancel">✕</button></div>
    <div class="pb-modal__body">${bodyHtml}</div>
    <div class="pb-modal__foot">${actions.map((a,i)=>`<button class="pb-btn ${a.cls}" data-act="${i}">${a.label}</button>`).join('')}</div>
  </div>`;
  mask.addEventListener('click',e=>{
    const btn=e.target.closest('button[data-act]');
    if(!btn)return;
    const act=btn.getAttribute('data-act');
    if(act==='cancel'){closeModal();return;}
    actions[Number(act)].fn();
  });
  document.body.appendChild(mask);modalEl=mask;
}
function closeModal(){if(modalEl){modalEl.remove();modalEl=null;}}

/* ============ 初始化 ============ */
render();
</script>
</body>
